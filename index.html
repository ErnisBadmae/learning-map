еория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Карточка собирает запрет, условия и исключения в одном месте. Это представление задачи, проверенное владельцем регламента.","kind":"plain","key":"b_m5_rule_0"},{"kind":"idea","text":"Поиск по объявлению может найти запрет, но пропустить исключение в другом разделе. Полнота правила важнее близости одного фрагмента.","key":"b_m5_rule_1"},{"text":"Один вызов проверяет одно правило: проще разметить ответ, калибровать вероятность и понять источник ошибки.","kind":"plain","key":"b_m5_rule_2"},{"text":"Общий итог собирает код. Модель не должна произвольно менять приоритеты противоречащих правил или решать, какие обязательные проверки пропустить.","kind":"plain","key":"b_m5_rule_3"},{"kind":"warn","text":"Сжатие регламента может потерять условие. Нужны версия карточки, проверка старшими модераторами и тесты на исключениях.","key":"b_m5_rule_4"},{"text":"На собесе: RAG, полный текст и карточка — альтернативные формы входа. Сравнивай их при фиксированных задачах, модели и бюджете.","kind":"plain","key":"b_m5_rule_5"}]},{"id":"data","title":"М5 · шумные метки и честный split","source":"M5.md, ч. 5–12, 15, 19; legend-m5.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Единица обучения — «объявление, правило, метка». Одно объявление может дать несколько проверок и не является несколькими независимыми объявлениями.","kind":"plain","key":"b_m5_data_0"},{"text":"30 тыс. проверок собраны из решений модераторов. Метки отражают и регламент, и рабочие конвенции, которые надо проверить на согласованность.","kind":"plain","key":"b_m5_data_1"},{"text":"Близкие дубли и серии одного продавца нельзя случайно раскидать между train и test: модель узнает шаблон вместо правила.","kind":"plain","key":"b_m5_data_2"},{"kind":"idea","text":"Разделение по продавцам проверяет перенос на новых продавцов; временной срез — на будущее. Выбор split должен соответствовать применению.","key":"b_m5_data_3"},{"kind":"warn","text":"Отсутствие жалобы не сразу означает верную публикацию: отрицательной метке нужно выдержать окно наблюдения.","key":"b_m5_data_4"},{"text":"На собесе: отдельно назови очистку, зрелость меток, дисбаланс правил и неизменённый test. Ребалансировка train не меняет частоты реального потока.","kind":"plain","key":"b_m5_data_5"}]},{"id":"inference","title":"М5 · один токен и вероятность ответа","source":"M5.md, ч. 5–12, 15, 19; legend-m5.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Генеративная модель может использоваться как классификатор: контекст содержит объявление и правило, а выход ограничен допустимыми ответами.","kind":"plain","key":"b_m5_inference_0"},{"text":"Вероятности токенов ответа оценивают соответствие этих ответов контексту. Нужно проверить токенизацию меток и способ нормировки допустимых вариантов.","kind":"plain","key":"b_m5_inference_1"},{"kind":"warn","text":"Вероятность сгенерированного токена не автоматически равна частоте нарушения. На неё влияют шаблон промпта, обучение и состав данных.","key":"b_m5_inference_2"},{"text":"Калибровка сопоставляет исходный скор с наблюдаемой частотой события на отдельной выборке; пороги затем выбираются под нужную цену ошибок.","kind":"plain","key":"b_m5_inference_3"},{"text":"Один токен уменьшает выход и стоимость decode, но чтение объявления и карточки всё равно требует prefill.","kind":"plain","key":"b_m5_inference_4"},{"kind":"plain","text":"Logits, sigmoid и softmax: когда это разные постановки и почему softmax не является калибровкой.","open":"logits","key":"b_m5_inference_5"}]},{"id":"logits","title":"М5 · sigmoid, softmax и порог","source":"M5.md, ч. 5–12, 15, 19; legend-m5.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Logit — скор до преобразования в вероятность. У бинарного классификатора sigmoid переводит один logit в диапазон от 0 до 1.","kind":"plain","key":"b_m5_logits_0"},{"kind":"num","text":"Формула: p=1/(1+exp(−z)). z — logit нарушения; p — скор после sigmoid. Отрицательный z даёт p ниже 0,5.","key":"b_m5_logits_1"},{"kind":"ctx","text":"Учебная подстановка: z=0 → p=0,5. Это середина шкалы, а не обязательный рабочий порог модерации.","key":"b_m5_logits_2"},{"text":"Softmax распределяет единичную массу между взаимоисключающими ответами. Несколько независимых правил могут нарушаться одновременно.","kind":"plain","key":"b_m5_logits_3"},{"kind":"warn","text":"Не смешивай softmax по словарю LLM и отдельные sigmoid в multi-label классификаторе М7. Форма выхода определяется архитектурой и задачей.","key":"b_m5_logits_4"},{"text":"На собесе: сначала объясни, откуда взялся скор, потом калибровку и порог. Наличие числа от 0 до 1 не доказывает калиброванность.","kind":"plain","key":"b_m5_logits_5"}]},{"id":"calibration","title":"М5 · калибровка и два порога","source":"M5.md, ч. 5–12, 15, 19; legend-m5.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Калиброванный прогноз p означает: среди похожих прогнозов с таким p событие случается примерно с этой частотой. Это свойство на распределении, не гарантия случая.","kind":"plain","key":"b_m5_calibration_0"},{"text":"Проверка: разбей прогнозы на корзины, сравни средний p с долей нарушений; отдельно смотри частые и редкие правила.","kind":"plain","key":"b_m5_calibration_1"},{"text":"Нижний порог: уверенно нет нарушения. Верхний: уверенно есть обратимое нарушение. Между ними — ручная проверка.","kind":"plain","key":"b_m5_calibration_2"},{"kind":"idea","text":"Разные пороги нужны из-за разных частот правил, цены ошибки и качества. Общий порог может скрыть плохое редкое правило.","key":"b_m5_calibration_3"},{"kind":"warn","text":"Порог выбирают на dev с нужным распределением, не на test. После смены очереди, модели или карточек калибровку проверяют снова.","key":"b_m5_calibration_4"},{"text":"На собесе: качество ранжирования, калибровка и качество выбранного порога — разные вещи. Хороший AUC не обещает безопасную автоматизацию.","kind":"plain","key":"b_m5_calibration_5"}]},{"id":"experiment","title":"М5 · A/B и доля автоматизации","source":"M5.md, ч. 5–12, 15, 19; legend-m5.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"В A/B по продавцам один продавец остаётся в одной группе. Иначе его похожие объявления могут загрязнить сравнение и изменить поведение между группами.","kind":"plain","key":"b_m5_experiment_0"},{"kind":"num","text":"Относительное изменение = metric_test/metric_control−1. Сокращение на 38% означает сохранение примерно 62% прежней ручной работы в этой очереди.","key":"b_m5_experiment_1"},{"kind":"num","text":"Пересчёт в общий поток: 0,38×0,09=0,0342, то есть 3,42%. Условие — спорная очередь остаётся 9% потока.","key":"b_m5_experiment_2"},{"text":"Guardrails: ошибки по независимому аудиту, апелляции и нагрузка контроля. Проверяй заранее заданную допустимую границу ухудшения.","kind":"plain","key":"b_m5_experiment_3"},{"kind":"warn","text":"«Разницы статистически не видно» не доказывает безопасность. Нужны достаточная мощность и интервал для допустимого ухудшения.","key":"b_m5_experiment_4"},{"text":"На собесе: назови единицу рандомизации, метрику, зрелость апелляций, доверительный интервал и правило остановки эксперимента.","kind":"plain","key":"b_m5_experiment_5"}]}]},{"id":"m6","group":"legend","title":"М6: семантический поиск услуг","source":"career/learn/beacon_cases/M6.md, ч. 5–11, 13, 15, 19; trainer/decks/legend-m6.json. Метрики и их условия: ч. 15.","levels":[{"id":"top","title":"М6: семантический поиск услуг","blocks":[{"text":"Задача поиска\n«Повесить карниз» и «монтаж креплений» описывают одну услугу разными словами","kind":"ctx","next":"как получить обучающие пары","open":"task","key":"b_m6_top_0"},{"text":"Данные и бенчмарк\nКонтакты — позитивы; негативы из батча и прежней выдачи; оценка на полном активном индексе","next":"учим представления","open":"data","key":"b_m6_top_1"},{"text":"E5 и проекция\nДообучение с InfoNCE; обучаемое сжатие 1024 → 128 измерений, не обрезка координат","next":"где искать ближайших","open":"training","key":"b_m6_top_2"},{"text":"Векторные кандидаты\nРегиональные индексы; география и категория — жёсткие фильтры","next":"объединяем две ветки","open":"ann","key":"b_m6_top_3"},{"text":"Общий пул и ранкер\n100 векторных + 300 полнотекстовых кандидатов → дедупликация → существующий ранкер без изменений","next":"офлайн и онлайн отдельно","open":"pool","key":"b_m6_top_4"},{"text":"Результат\nКонтакты на 1 000 подходящих сессий: +4% в A/B\nХранение векторов — в 8 раз меньше; экономия всего индекса считается отдельно","kind":"num","open":"evaluation","key":"b_m6_top_5"}],"side":[{"at":0,"text":"Старт: полнотекстовая ветка\nПолнота пула 49,0%, Recall@10 после ранкера 24,1%"},{"at":0,"kind":"idea","text":"Гипотеза\nВекторная ветка найдёт услуги, описанные другими словами, а существующий ранкер их поднимет"},{"at":2,"text":"Офлайн: E5\nПолнота кандидатов: готовая 29,5%, дообученная 47,9%, 128 измерений 47,1%\nКопия индекса 10,7 → 2,6 ГБ"},{"at":3,"text":"SLA\n+13 мс к p95 этапа кандидатов"},{"at":4,"text":"Офлайн: пул и ранкер\nПолнота пула 49,0 → 61,3%; Recall@10 24,1 → 26,8%\nТочность первой десятки 0,71 → 0,74"},{"at":5,"text":"Онлайн: A/B 3 недели\nКонтакты на 1 000 сессий +4% — относительно, не пункты\nНовых объявлений в первой десятке 11%"}]},{"id":"task","title":"М6 · retrieval и ranking — разные задачи","source":"M6.md, ч. 5–12, 15, 19; legend-m6.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Retrieval быстро собирает много потенциально подходящих объявлений. Ranking упорядочивает их под полезное действие пользователя.","kind":"plain","key":"b_m6_task_0"},{"text":"Семантический retrieval восстанавливает совпадения по смыслу без общих слов; лексическая ветка сохраняет точность на брендах и моделях.","kind":"plain","key":"b_m6_task_1"},{"kind":"idea","text":"Дополнительная ветка полезна за счёт новых хороших кандидатов, а не просто большего количества. Нерелевантные кандидаты могут испортить верх выдачи.","key":"b_m6_task_2"},{"text":"Эмбеддер кодирует соответствие текстов; цена, качество исполнителя и поведение пользователя учитываются существующим ранкером.","kind":"plain","key":"b_m6_task_3"},{"kind":"warn","text":"Тематическая близость недостаточна: продажа и ремонт прибора близки по словам, но решают разные намерения.","key":"b_m6_task_4"},{"text":"На собесе: сначала назови промах baseline и покажи срез запроса. Улучшение модели без анализа, где теряются контакты, не задаёт цель.","kind":"plain","key":"b_m6_task_5"}]},{"id":"data","title":"М6 · позитивы, контакты и негативы","source":"M6.md, ч. 5–12, 15, 19; legend-m6.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Контакт — наблюдаемый признак полезности пары «запрос–объявление». Это сильнее случайного клика, но зависит от показа и позиции.","kind":"plain","key":"b_m6_data_0"},{"text":"Отсутствие контакта не доказывает нерелевантность: пользователь мог не увидеть карточку или выбрать другого подходящего исполнителя.","kind":"plain","key":"b_m6_data_1"},{"text":"In-batch негативы — объявления из других пар батча. Они дёшевы, но часть может подходить и текущему запросу.","kind":"plain","key":"b_m6_data_2"},{"text":"Трудные негативы берут из прежней выдачи: тексты похожи, действие неверное. Проверка и фильтры снижают долю ложных негативов.","kind":"plain","key":"b_m6_data_3"},{"kind":"warn","text":"В М6 индекс содержит знакомые объявления, а проверка идёт на новых запросах и контактах. Это не то же требование, что split по новым объектам М1.","key":"b_m6_data_4"},{"text":"На собесе: различай утечку и реалистичный каталог. Будущие версии объявлений и будущие контакты не должны оказаться в обучающем окне.","kind":"plain","key":"b_m6_data_5"}]},{"id":"training","title":"М6 · как обучается E5","source":"M6.md, ч. 5–12, 15, 19; legend-m6.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Bi-encoder строит представления запроса и объявления. В кейсе веса общие; разные префиксы и поля задают роли входов.","kind":"plain","key":"b_m6_training_0"},{"kind":"plain","text":"InfoNCE: позитив конкурирует с негативами по сходству; температура регулирует резкость сравнения.","open":"infonce","key":"b_m6_training_1"},{"text":"Полное дообучение адаптирует энкодер к намерениям пользователей, а не только к общей теме. В М6 ранкер в эксперименте не менялся.","kind":"plain","key":"b_m6_training_2"},{"kind":"plain","text":"Проекция 1024→128 обучается вместе с энкодером. Почему это отличается от обрезки и как оценить потерю?","open":"compression","key":"b_m6_training_3"},{"kind":"warn","text":"Большой батч даёт больше конкурентов, но не исправляет ложные негативы. Просто увеличить их число может ухудшить представления.","key":"b_m6_training_4"},{"text":"На собесе: назови baseline готовой E5, тип loss, построение батча и негативов, метрику dev и способ обновления индекса.","kind":"plain","key":"b_m6_training_5"}]},{"id":"infonce","title":"М6 · InfoNCE и температура","source":"M6.md, ч. 5–12, 15, 19; legend-m6.json. Теория — общее знание. https://www.sbert.net/docs/package_reference/sentence_transformer/losses.html Учебные примеры не являются замерами кейса.","blocks":[{"kind":"num","text":"Формула: L=−ln[exp(s⁺/τ)/Σ_j exp(s_j/τ)]. Сумма включает позитив и выбранные негативы.","key":"b_m6_infonce_0"},{"text":"Буквы: s — сходство запроса с объявлением; плюс — позитив; j — кандидаты обучения; τ — температура. Loss растёт, если негативы конкурируют с позитивом.","kind":"plain","key":"b_m6_infonce_1"},{"kind":"ctx","text":"Учебный расчёт: s⁺=2, s⁻=0, τ=1 → p⁺≈0,881, L≈0,127. Это пример формулы, не значения скоров E5 в кейсе.","key":"b_m6_infonce_2"},{"text":"Малая температура усиливает различия скоров и внимание к трудным конкурентам. Её выбирают по dev, слишком малая повышает чувствительность к шумным меткам.","kind":"plain","key":"b_m6_infonce_3"},{"kind":"idea","text":"BCE требует надёжных бинарных меток пар; triplet сравнивает выбранные пары. InfoNCE естественно учит выделять позитив среди многих кандидатов.","key":"b_m6_infonce_4"},{"kind":"warn","text":"Softmax здесь нормирован по обучающему набору кандидатов. Его значение не является вероятностью контакта во всём каталоге.","key":"b_m6_infonce_5"}]},{"id":"compression","title":"М6 · проекция и память векторов","source":"M6.md, ч. 5–12, 15, 19; legend-m6.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Линейная проекция умножает исходный вектор на обучаемую матрицу и меняет пространство. В кейсе она обучается под задачу retrieval.","kind":"plain","key":"b_m6_compression_0"},{"kind":"idea","text":"Обрезка просто отбрасывает координаты. Без специального обучения первые координаты не обязаны содержать всю полезную информацию.","key":"b_m6_compression_1"},{"kind":"num","text":"Память сырых векторов ≈ число объектов × размерность × байт на координату. При прочих равных 1024/128=8 — экономия в восемь раз.","key":"b_m6_compression_2"},{"text":"К графу ANN добавляются рёбра, идентификаторы и метаданные. Поэтому весь индекс обычно уменьшается слабее, чем массив координат.","kind":"plain","key":"b_m6_compression_3"},{"kind":"warn","text":"После сжатия проверь полноту, срезы запросов и ANN-параметры. Одинаковая память не означает одинаковую точность поиска.","key":"b_m6_compression_4"},{"text":"На собесе: различай проекцию, PCA, квантование и обрезку. Они меняют данные разными способами и имеют разные требования к обучению.","kind":"plain","key":"b_m6_compression_5"}]},{"id":"ann","title":"М6 · ANN, HNSW и фильтры","source":"M6.md, ч. 5–12, 15, 19; legend-m6.json. Теория — общее знание. https://arxiv.org/abs/1603.09320 Учебные примеры не являются замерами кейса.","blocks":[{"text":"Точный поиск сравнивает запрос со всеми векторами. ANN ускоряет поиск, допуская, что часть истинно ближайших будет пропущена.","kind":"plain","key":"b_m6_ann_0"},{"text":"HNSW — многоуровневый граф соседства: грубый поиск по верхним уровням, уточнение по более плотному нижнему.","kind":"plain","key":"b_m6_ann_1"},{"text":"M влияет на число связей и память. efConstruction — бюджет построения, efSearch — ширина поиска при запросе; больше бюджет обычно повышает recall и цену.","kind":"plain","key":"b_m6_ann_2"},{"kind":"warn","text":"Recall ANN измеряют относительно точных ближайших по той же метрике. Это не продуктовый recall релевантных объявлений.","key":"b_m6_ann_3"},{"kind":"idea","text":"Глобальный top-k с последующим геофильтром может оставить пустую выдачу. Региональные индексы или поиск с фильтрами ищут в допустимом пространстве.","key":"b_m6_ann_4"},{"text":"На собесе: раздели ошибки эмбеддера, приближённого индекса и бизнес-фильтра. Один общий Recall@k не объяснит причину промаха.","kind":"plain","key":"b_m6_ann_5"}]},{"id":"pool","title":"М6 · объединение кандидатов и ограничения","source":"M6.md, ч. 5–12, 15, 19; legend-m6.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"География и категория — жёсткие ограничения: неподходящий город не должен становиться допустимым из-за высокого семантического скора.","kind":"plain","key":"b_m6_pool_0"},{"text":"В кейсе до 100 векторных и 300 полнотекстовых кандидатов объединяются по ID и дедуплицируются перед ранкером.","kind":"plain","key":"b_m6_pool_1"},{"kind":"idea","text":"RRF полезен, когда ветки конкурируют за ограниченные места. Здесь ранкер видит весь объединённый пул, и слияние скоров не требуется.","key":"b_m6_pool_2"},{"text":"Дедупликация не должна удалять полезные признаки происхождения кандидата. Ранкер должен получать согласованный набор входных признаков.","kind":"plain","key":"b_m6_pool_3"},{"kind":"warn","text":"Новая ветка меняет распределение кандидатов. Старый ранкер может плохо поднимать новые хорошие объявления, даже если retrieval стал лучше.","key":"b_m6_pool_4"},{"text":"На собесе: поясни, что было заморожено в A/B. В М6 эффект относится к ветке кандидатов, потому что ранкер и интерфейс не менялись.","kind":"plain","key":"b_m6_pool_5"}]},{"id":"evaluation","title":"М6 · офлайн-метрики и контакты","source":"M6.md, ч. 5–12, 15, 19; legend-m6.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Recall@k требует полного определения релевантных элементов и каталога. Малый корпус случайных негативов делает поиск искусственно лёгким.","kind":"plain","key":"b_m6_evaluation_0"},{"text":"Precision@k — доля релевантных в верхних k; MRR усредняет обратный ранг первого релевантного. Они отвечают на разные вопросы.","kind":"plain","key":"b_m6_evaluation_1"},{"kind":"warn","text":"Рост полноты пула не обязан дать такой же рост контактов. Между ними ранкер, показ, выбор пользователя и доступность исполнителя.","key":"b_m6_evaluation_2"},{"kind":"num","text":"В A/B +4% = контакты на 1 000 подходящих сессий в тесте / ту же метрику контроля −1. Это относительный прирост, не +4 п.п. конверсии.","key":"b_m6_evaluation_3"},{"text":"Рандомизация по пользователю удерживает его опыт в одной группе. Общие исполнители создают возможное влияние групп друг на друга.","kind":"plain","key":"b_m6_evaluation_4"},{"text":"На собесе: офлайн ищет причину, онлайн проверяет пользу. Следи за задержкой, пустыми выдачами, качеством контактов и устойчивостью после раскатки.","kind":"plain","key":"b_m6_evaluation_5"}]}]},{"id":"m7","group":"legend","title":"М7: антифрод в переписке","source":"career/learn/beacon_cases/M7.md, ч. 5–11, 13, 15, 19; trainer/decks/legend-m7.json. Метрики и их условия: ч. 15.","levels":[{"id":"top","title":"М7: антифрод в переписке","blocks":[{"text":"Риск в контексте диалога\nПросьба о предоплате оценивается вместе со ссылками, срочностью и предыдущими сообщениями","kind":"ctx","next":"готовим данные","open":"dialogue","key":"b_m7_top_0"},{"text":"Разметка и разделение\nЛюди размечают сценарии риска; окна с ролями и маскированием; сплит по кампаниям и времени","next":"учим сильную модель","open":"labels","key":"b_m7_top_1"},{"text":"Учитель ruRoBERTa\nОбщий энкодер, четыре совместимых сценария; отдельные вероятности и пороги","next":"переносим знания в маленькую модель","open":"teacher","key":"b_m7_top_2"},{"text":"Ученик rubert-tiny2\nМетки людей + мягкие вероятности учителя на 2,4 млн диалогов; температура и вес смешивания","next":"запускаем на CPU","open":"distillation","key":"b_m7_top_3"},{"text":"Предупреждение и контроль\nONNX Runtime на CPU; высокий риск → предупреждение и очередь контроля; запасной путь — TF-IDF","next":"что именно измерили","open":"serving","key":"b_m7_top_4"},{"text":"Результат\np95 ученика: 14 мс\nДоля переписок с жалобой в 14-дневном окне: −17% в A/B\nPrecision теста и потока различаются","kind":"num","open":"evaluation","key":"b_m7_top_5"}],"side":[{"at":0,"text":"Старт: старая модель\nПолнота 0,58 при точности ≈0,95 на test"},{"at":0,"kind":"idea","text":"Гипотеза\nРиск виден в контексте диалога, а не в одном сообщении; предупреждение в моменте снизит жалобы на обман"},{"at":1,"text":"Разметка\nСогласие асессоров 84%, каппа Флейсса 0,71"},{"at":2,"text":"Офлайн: учитель\nПолнота 0,74 при точности ≈0,95"},{"at":3,"text":"Офлайн: ученик\nПолнота 0,70 (без дистилляции 0,64)\nЧерез полгода без переобучения 0,63"},{"at":4,"text":"SLA и поток\np95 на CPU 14 мс\nТочность на потоке 0,66; предупреждено 1,2% переписок"},{"at":5,"text":"Онлайн: A/B\nПереписок с жалобой за 14 дней −17% к контролю\nЭто не число предотвращённых мошенничеств"}]},{"id":"dialogue","title":"М7 · почему нужен контекст","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Отдельная фраза «внесите предоплату» неоднозначна. Контекст включает предмет сделки, последовательность сообщений, роли и внешние ссылки.","kind":"plain","key":"b_m7_dialogue_0"},{"text":"Окно последних сообщений ограничивает длину и задержку. Обрезка должна сохранять последнее событие и важный предыдущий контекст.","kind":"plain","key":"b_m7_dialogue_1"},{"text":"Маскирование заменяет чувствительные значения типами: номер карты, телефон, ссылка. Полезно сохранить признаки типа ссылки, не копируя секретные значения.","kind":"plain","key":"b_m7_dialogue_2"},{"kind":"warn","text":"Чрезмерная нормализация удаляет сигнал. Полное удаление URL стирает различие между сообщением без ссылки и ссылкой на внешнюю оплату.","key":"b_m7_dialogue_3"},{"text":"Скоринг выполняется на момент текущего сообщения. Будущая жалоба может быть меткой, но не признаком, доступным модели.","kind":"plain","key":"b_m7_dialogue_4"},{"text":"На собесе: расскажи единицу предсказания, сборку окна, время доступности признаков и поведение при слишком длинном диалоге.","kind":"plain","key":"b_m7_dialogue_5"}]},{"id":"labels","title":"М7 · разметка и мошеннические кампании","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Случайная часть потока нужна для представительности; корзины старого скора дают больше редких и пограничных случаев. Их смешение меняет частоты датасета.","kind":"plain","key":"b_m7_labels_0"},{"text":"Разногласия асессоров могут означать неоднозначность инструкции, а не просто ошибку одного человека. Сначала анализ причин, затем изменение инструкции.","kind":"plain","key":"b_m7_labels_1"},{"kind":"idea","text":"Согласие сверх случайного можно оценить каппой. Оно зависит от частот классов и не заменяет разбор опасных разногласий.","key":"b_m7_labels_2"},{"text":"Кампания повторяет шаблон в разных диалогах. Группировка похожих текстов и временной split мешают запомнить кампанию в train и узнать её в test.","kind":"plain","key":"b_m7_labels_3"},{"kind":"warn","text":"Удаление несогласованных примеров делает train чище, но реальный поток остаётся неоднозначным. Такие случаи нужно отдельно аудировать.","key":"b_m7_labels_4"},{"text":"На собесе: отдельно укажи число размеченных, принятых в train и неразмеченных диалогов переноса. Это разные источники обучения.","kind":"plain","key":"b_m7_labels_5"}]},{"id":"teacher","title":"М7 · encoder и multi-label классификация","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Encoder читает доступное окно целиком и строит контекстные представления токенов. Классификационная голова выдаёт скоры сценариев.","kind":"plain","key":"b_m7_teacher_0"},{"text":"Bidirectional attention использует левый и правый контекст внутри уже полученного окна. Это не разрешение заглядывать в будущие сообщения.","kind":"plain","key":"b_m7_teacher_1"},{"text":"Четыре сценария могут встречаться одновременно, поэтому у каждого своя sigmoid. Softmax сделал бы их взаимоисключающими.","kind":"plain","key":"b_m7_teacher_2"},{"kind":"idea","text":"Один общий энкодер дешевле нескольких независимых прогонов и позволяет делить признаки. Но изменение общего представления затрагивает все сценарии.","key":"b_m7_teacher_3"},{"kind":"plain","text":"Почему BCE подходит для независимых бинарных меток и что делают веса классов — раскрытие функции потерь.","open":"bce","key":"b_m7_teacher_4"},{"kind":"warn","text":"Учитель нужен для переноса знаний, но оценивается на человеческих метках. Согласие маленькой модели с большим учителем не равно правильности.","key":"b_m7_teacher_5"}]},{"id":"bce","title":"М7 · BCE и дисбаланс","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. https://docs.pytorch.org/docs/2.15/generated/torch.nn.BCEWithLogitsLoss.html Учебные примеры не являются замерами кейса.","blocks":[{"kind":"num","text":"Формула для одного сценария: L=−[y ln p+(1−y)ln(1−p)]. Для multi-label ошибки сценариев суммируются или усредняются.","key":"b_m7_bce_0"},{"text":"Буквы: y — бинарная метка; p — sigmoid(logit). При y=1 штрафуем малую p, при y=0 — большую p.","kind":"plain","key":"b_m7_bce_1"},{"kind":"ctx","text":"Учебный расчёт: y=1, p=0,8 → L≈0,223; y=0 при той же p → L≈1,609. Это пример, не измеренный loss ученика.","key":"b_m7_bce_2"},{"text":"BCEWithLogitsLoss объединяет sigmoid и loss в численно устойчивой форме. Отдельное вычисление вероятностей и логарифмов может потерять точность.","kind":"plain","key":"b_m7_bce_3"},{"kind":"warn","text":"Вес положительного класса меняет вклад ошибок и оптимальный скор. После взвешивания нельзя автоматически считать выход калиброванной частотой потока.","key":"b_m7_bce_4"},{"text":"На собесе: oversampling и веса не создают новых редких случаев. Сравнивай по независимому test, затем проверяй калибровку и рабочие пороги.","kind":"plain","key":"b_m7_bce_5"}]},{"id":"distillation","title":"М7 · дистилляция без подмены задачи","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. https://arxiv.org/abs/1503.02531 Учебные примеры не являются замерами кейса.","blocks":[{"text":"Учитель переносит знания на большой неразмеченный набор мягкими вероятностями. Ученик обучается одновременно на человеческих метках и сигнале учителя.","kind":"plain","key":"b_m7_distillation_0"},{"text":"Для каждого сценария sigmoid(logit/T) при T>1 смягчает уверенность. В multi-label не используют один softmax между независимыми сценариями.","kind":"plain","key":"b_m7_distillation_1"},{"kind":"num","text":"Схема loss: α·BCE(люди)+(1−α)·T²·BCE(мягкие цели). В кейсе T=2, α=0,5; мягкая часть сравнивает учителя и ученика при одной температуре.","key":"b_m7_distillation_2"},{"kind":"idea","text":"Мягкая цель хранит неопределённость: пограничный пример не превращается в безусловную истину. При применении температура переноса не нужна.","key":"b_m7_distillation_3"},{"kind":"warn","text":"Учитель переносит и свои ошибки. Ученика сравнивают с baseline по человеческим меткам; размер сети и скорость не гарантируют достаточного качества.","key":"b_m7_distillation_4"},{"text":"В кейсе recall ученика на test: 0,64 без переноса → 0,70 с переносом; учитель 0,74. Выгода — часть качества учителя при CPU-бюджете.","kind":"plain","key":"b_m7_distillation_5"}]},{"id":"serving","title":"М7 · ONNX, CPU и деградация","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"ONNX описывает вычислительный граф; ONNX Runtime исполняет его с оптимизациями под устройство. Экспорт — изменение способа выполнения, а не новое обучение.","kind":"plain","key":"b_m7_serving_0"},{"text":"Сверь выходы до и после экспорта, особенно около порогов. Малое численное отклонение может поменять действие пограничного примера.","kind":"plain","key":"b_m7_serving_1"},{"kind":"idea","text":"CPU-бюджет проверяют под рабочими длинами окон и конкурентностью. Хвост задержки важнее скорости одного короткого примера.","key":"b_m7_serving_2"},{"text":"В кейсе p95=14 мс; при тайм-ауте 30 мс запасной TF-IDF даёт сигнал только в очередь контроля, без предупреждения.","kind":"plain","key":"b_m7_serving_3"},{"kind":"warn","text":"Квантование может дополнительно ускорить CPU, но менять точность и пороги. В кейсе int8 не взят из-за потери качества при уже выполненном бюджете.","key":"b_m7_serving_4"},{"text":"На собесе: мониторь ошибки, задержку, долю fallback, дрейф скоров и аудит новых схем. Поведение системы при отказе — часть решения.","kind":"plain","key":"b_m7_serving_5"}]},{"id":"evaluation","title":"М7 · precision, recall и порог","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Precision=TP/(TP+FP): сколько предупреждений обоснованы. Recall=TP/(TP+FN): сколько рисковых случаев обнаружены.","kind":"plain","key":"b_m7_evaluation_0"},{"kind":"idea","text":"Снижение порога обычно повышает recall и число ложных предупреждений. Цена ошибки определяется действием: предупреждение и блокировка требуют разных порогов.","key":"b_m7_evaluation_1"},{"kind":"warn","text":"При редком риске accuracy обманчива: постоянный ответ «всё хорошо» может выглядеть отличным, не найдя ни одного опасного случая.","key":"b_m7_evaluation_2"},{"kind":"plain","text":"ROC-AUC и PR-AUC оценивают ранжирование на множестве порогов. Для действия нужен отдельный выбранный и проверенный порог.","open":"curves","key":"b_m7_evaluation_3"},{"kind":"plain","text":"Precision на обогащённом test и в потоке различается из-за базовой частоты. Разбор через формулу Байеса — глубже.","open":"prevalence","key":"b_m7_evaluation_4"},{"kind":"plain","text":"−17% жалоб — экспериментальная метрика поведения; её знаменатель и причинные границы разбираются отдельно.","open":"experiment","key":"b_m7_evaluation_5"}]},{"id":"curves","title":"М7 · ROC, PR и рабочая точка","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"ROC показывает TPR=recall против FPR=FP/(FP+TN) при разных порогах. ROC-AUC описывает способность ставить позитив выше негатива.","kind":"plain","key":"b_m7_curves_0"},{"text":"PR показывает precision против recall. При редких позитивах она нагляднее отражает, сколько ложных тревог приходится на полезные.","kind":"plain","key":"b_m7_curves_1"},{"kind":"warn","text":"ROC-AUC может выглядеть хорошо при большом числе ложных тревог: маленькая доля огромного класса нормальных случаев всё равно велика.","key":"b_m7_curves_2"},{"text":"Площадь под PR зависит от базовой частоты и способа расчёта. Сравнение на разных выборках без учёта их состава некорректно.","kind":"plain","key":"b_m7_curves_3"},{"kind":"idea","text":"Для продукта выбирай recall при допустимой precision, FPR или мощности контроля. Средний AUC не задаёт цену выбранного действия.","key":"b_m7_curves_4"},{"text":"На собесе: порог подбирается на dev, затем фиксируется и проверяется на test и потоке. Не ищи лучший порог по итоговому test.","kind":"plain","key":"b_m7_curves_5"}]},{"id":"prevalence","title":"М7 · Байес и редкий риск","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"kind":"num","text":"Формула: PPV=TPR·π / [TPR·π+FPR·(1−π)]. PPV — precision при заданном пороге.","key":"b_m7_prevalence_0"},{"text":"Буквы: π — доля риска; TPR — доля найденных рисковых; FPR — доля ошибочных тревог среди нормальных. Чем реже риск, тем сильнее вклад ложных тревог.","kind":"plain","key":"b_m7_prevalence_1"},{"kind":"num","text":"В кейсе доля риска: 10% в test и около 1,2% в потоке. Precision 0,95 на test не переносится напрямую; аудит потока дал около 0,66.","key":"b_m7_prevalence_2"},{"kind":"warn","text":"Пересчёт Байеса предполагает неизменные TPR/FPR. При смене тем, продавцов или схем это может нарушиться — нужна проверка в потоке.","key":"b_m7_prevalence_3"},{"text":"Аудит случайной выборки срабатываний оценивает precision. Чтобы оценить recall, нужны ещё метки пропущенных случаев или независимая выборка потока.","kind":"plain","key":"b_m7_prevalence_4"},{"text":"На собесе: объясни, почему при точности около 0,66 действие — предупреждение и контроль, а не автоматическая блокировка.","kind":"plain","key":"b_m7_prevalence_5"}]},{"id":"experiment","title":"М7 · A/B, интервалы и жалобы","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"A/B по продавцам удерживает кампанию в одной группе. Метрика: доля впервые включённых переписок с жалобой после полного 14-дневного окна.","kind":"plain","key":"b_m7_experiment_0"},{"kind":"num","text":"В кейсе около 0,84%→0,70%: −0,14 п.п.; 0,70/0,84−1≈−16,7%, округлённо −17%. Это относительное изменение доли.","key":"b_m7_experiment_1"},{"text":"Жалобы одного продавца коррелируют. Доверительный интервал должен учитывать кластеры; простой расчёт по независимым диалогам будет слишком уверенным.","kind":"plain","key":"b_m7_experiment_2"},{"text":"Bootstrap пересэмплирует независимые единицы и пересчитывает метрику. Интервал отражает неопределённость при выбранной схеме выборки.","kind":"plain","key":"b_m7_experiment_3"},{"kind":"warn","text":"Предупреждение меняет поведение и склонность жаловаться. Поэтому −17% жалоб не означает столько же предотвращённых мошенничеств.","key":"b_m7_experiment_4"},{"kind":"plain","text":"Проверка гипотез, мощность и многократное подглядывание в эксперимент — отдельная шпаргалка.","open":"statistics","key":"b_m7_experiment_5"}]},{"id":"statistics","title":"М7 · фундамент эксперимента","source":"M7.md, ч. 5–12, 15, 19; legend-m7.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Рандомизация делает группы сравнимыми в среднем. Проверь корректность назначения, баланс трафика и отсутствие изменений помимо воздействия.","kind":"plain","key":"b_m7_statistics_0"},{"text":"До запуска зафиксируй основную метрику, допустимые ухудшения, минимально важный эффект и период зрелости меток. Это определяет нужный объём выборки.","kind":"plain","key":"b_m7_statistics_1"},{"text":"Мощность — вероятность обнаружить заданный эффект, если он есть. Редкое событие, кластеризация и малый эффект требуют больше данных.","kind":"plain","key":"b_m7_statistics_2"},{"kind":"warn","text":"p-value — вероятность столь же или более экстремальных данных при нулевой модели. Это не вероятность того, что гипотеза верна.","key":"b_m7_statistics_3"},{"text":"Доверительный интервал показывает диапазон эффектов, совместимых с процедурой оценивания. Статистическая значимость не равна бизнес-ценности.","kind":"plain","key":"b_m7_statistics_4"},{"kind":"warn","text":"Постоянное подглядывание с остановкой при удачном p-value повышает ложные открытия. Нужен фиксированный план или корректная последовательная процедура.","key":"b_m7_statistics_5"}]}]},{"id":"mlsd","group":"mlsd","title":"MLSD: база","source":"Каркас любого мока: этапы и номера как у тьютора, на 5-м — развилка «классика или LLM». Справа — как говорить. Кейсы (raif-mlsd, broker-mlsd) — его заполнение. Сверено с материалами ментора: career/learn/talks/MLSD_BASE_REVIEW_2026-11-17.md. 18.11: таблица таргетов и механика — после внешнего мока, career/learn/broker_ai/cases/README.md","levels":[{"id":"top","title":"Маршрут","blocks":[{"text":"1. Рамки\nпродукт и пользователь · числа предполагаешь сам","open":"frame","key":"b_mlsd_top_0"},{"text":"2. Метрики и приёмка\nбизнес · защитные · офлайн → онлайн","open":"metric","key":"b_mlsd_top_1"},{"text":"3. Постановка\nбез ML → входы / выходы → таблица таргетов → действие по уверенности","open":"setup","key":"b_mlsd_top_2"},{"text":"4. Данные и офлайн-оценка\nметка · ловушки · эталон","open":"data","key":"b_mlsd_top_3"},{"text":"5. Модель: классика\nклассификация, ранжирование, антифрод · голова и лосс на каждый выход","open":"classic","key":"b_mlsd_top_4"},{"text":"5. Модель: LLM и агент\nworkflow раньше агента · поиск · оценка судьёй","open":"llm","alt":true,"key":"b_mlsd_top_5"},{"text":"6. Архитектура и отказы\nонлайн или очередь · каскад · сервинг по типу модели · что при падении","open":"arch","key":"b_mlsd_top_6"},{"text":"7. Запуск и жизнь после\nA/B целиком · мониторинг · обратная связь","open":"launch","key":"b_mlsd_top_7"},{"text":"8. Итог\nузкие места · компромиссы · MVP и v2","open":"wrap","key":"b_mlsd_top_8"}],"side":[{"text":"Время\nрамки ≤ 5 мин, дальше ~8 мин на этап; детали — в конце (MADE, мок на 40 мин)","at":0,"kind":"ctx"},{"text":"Каждый выбор\n«X, а не Y, потому что Z»","at":0,"kind":"idea"}]},{"id":"frame","title":"1. Рамки","blocks":[{"text":"Продукт и пользователь\nкто · какое решение принимает · что значит «решено»","kind":"ctx","key":"b_mlsd_frame_0"},{"text":"Цена ошибки\nчто дороже: пропуск или ложная тревога","key":"b_mlsd_frame_1"},{"text":"Инженерные числа\nпользователи → пиковый RPS · задержка p95/p99\nцена запроса · объём данных","kind":"num","key":"b_mlsd_frame_2"},{"text":"Ограничения\nгде живут данные и модель · персональные данные","key":"b_mlsd_frame_3"}],"side":[{"text":"Сам\nчисла предположи вслух и запиши — интервьюер их не скажет, он поправит","at":2,"kind":"idea"}]},{"id":"metric","title":"2. Метрики и приёмка: три вопроса к ошибке","blocks":[{"text":"Что с человеком при каждой ошибке\nкто платит, можно ли откатить, заметит ли кто-то","open":"n1","key":"b_mlsd_metric_0"},{"text":"Какая ошибка дороже\nеё метрика становится целью, метрика дешёвой ошибки становится ограничением","kind":"idea","open":"n2","key":"b_mlsd_metric_1"},{"text":"Что даёт крайность\n«скрыть всё», «поднять всё» или «ничего не показывать» ломают одну метрику, нужна пара цель плюс ограничение","kind":"warn","open":"n3","key":"b_mlsd_metric_2"},{"text":"Агент: ошибка на задаче целиком\nсчитаем долю задач, доведённых до верного результата, а не красивую реплику","key":"b_mlsd_metric_3"},{"text":"Метрики домена — по имени\nконтакт-центр: FCR, переадресации, время ответа · брокер: доля без оператора, ошибки поручений","kind":"ctx","key":"b_mlsd_metric_4"},{"text":"Приёмка одной строкой\nцель при ограничении, защитная не хуже контроля, число называем допущением","kind":"num","open":"n4","key":"b_mlsd_metric_5"}],"side":[{"text":"Ловушка\nофлайн вырос — ещё не повод выкатывать: решает A/B","at":2,"kind":"warn"}]},{"id":"setup","title":"3. Постановка","blocks":[{"text":"Решение без ML\nправила, поиск, эвристика · бейзлайн и источник разметки","kind":"idea","key":"b_mlsd_setup_0"},{"text":"Входы / выходы / ограничения\nтри колонки на доске · головы — на выходы, энкодеры — на входы","kind":"idea","key":"b_mlsd_setup_1"},{"text":"Таблица таргетов\nна каждый выход: тип задачи → метка и когда приходит → лосс → метрика → действие","key":"b_mlsd_setup_2"},{"text":"Действие по уверенности\nкалибровка → пороги → сам · мягкое действие · человек","key":"b_mlsd_setup_3"},{"text":"Схема целиком за минуту\nданные → модель → сервис → обратная связь","kind":"ctx","key":"b_mlsd_setup_4"}],"side":[{"text":"Пример (мок 17.11)\nвходы: текст, голос, картинка · выходы: тема — мультикласс, срочность — порядковая, эскалация — бинарная + калибровка","at":2,"kind":"warn"},{"text":"Пример (гайд)\nантифрод: уверенность > 90–95% — бан, 70–95% — лимиты; ложный бан снимает поддержка","at":3,"kind":"ctx"},{"text":"Для LLM\nответить сам · переспросить · передать человеку","at":3,"kind":"ctx"}]},{"id":"data","title":"4. Данные и офлайн-оценка","blocks":[{"text":"Источники и метка\nоткуда таргет · сколько · как часто","key":"b_mlsd_data_0"},{"text":"Слабая метка\nжалобы, апелляции, действия людей — без ручной разметки","kind":"idea","key":"b_mlsd_data_1"},{"text":"Ловушки\nутечка из будущего · признаки на момент события · смещение · дисбаланс","kind":"warn","key":"b_mlsd_data_2"},{"text":"Эталон и сплит\nпо времени или по пользователям · метрика + интервал","key":"b_mlsd_data_3"}],"side":[{"text":"Для LLM\nэталон — вопросы с ответами из логов; база знаний — тоже данные","at":3,"kind":"ctx"}]},{"id":"classic","title":"5. Модель: классика","blocks":[{"text":"Бейзлайн первым\nсчётчики и линейная модель; усложнение только с приростом на эталоне","kind":"idea","key":"b_mlsd_classic_0"},{"text":"Лестница моделей\nот простого к сложному, на каждой ступени своя метрика","open":"n8","key":"b_mlsd_classic_1"},{"text":"Классы: исключают или пересекаются\nвопрос к задаче: могут ли у объекта быть две метки сразу?","kind":"idea","open":"n9","key":"b_mlsd_classic_2"},{"text":"Признаки\nпользователь объект контекст счётчики","key":"b_mlsd_classic_3"},{"text":"Кандидаты → ранжирование\nдешёвый отбор из всего каталога → точная модель на коротком списке","key":"b_mlsd_classic_4"},{"text":"Головы и лоссы\nсвой лосс на каждый выход несколько задач взвешенная сумма + маска пропущенных меток как часто переобучать","open":"n10","key":"b_mlsd_classic_5"},{"text":"Несколько модальностей\nсначала всё в текст (ASR, OCR) → объединение эмбеддингов пустая модальность маска","key":"b_mlsd_classic_6"}]},{"id":"llm","title":"5. Модель: LLM и агент","blocks":[{"text":"Workflow раньше агента\nшаги задаёт код, LLM — внутри шага · агент, когда шаги заранее не известны","kind":"idea","key":"b_mlsd_llm_0"},{"text":"Паттерн\nцепочка с проверками · роутинг · параллель или голосование · оркестратор · генератор + проверяющий","key":"b_mlsd_llm_1"},{"text":"Знания\nпромпт → поиск по базе → дообучение · Recall@K отдельно от качества ответа","key":"b_mlsd_llm_2"},{"text":"Оценка\nэталон + LLM-судья, судью сверить с людьми · безопасность и уход от темы","key":"b_mlsd_llm_3"},{"text":"Мультиагент — позже\nповод: перегрузка инструментами, много ветвлений · лимит шагов и повторов","kind":"warn","key":"b_mlsd_llm_4"}],"side":[{"text":"Цена агента\n~4× токенов против обычного чата (курс, лекция 2)","at":0,"kind":"num"}]},{"id":"arch","title":"6. Архитектура и отказы","blocks":[{"text":"Онлайн или очередь\nрешают задержка и нагрузка из этапа 1 · тяжёлое (аудио, документы) — асинхронно","key":"b_mlsd_arch_0"},{"text":"Каскад\nдешёвое — на весь поток, дорогое — на спорное","kind":"idea","key":"b_mlsd_arch_1"},{"text":"Хранилища и сервинг\nодни признаки для обучения и прода · линейная — CPU в сервисе · энкодер — сервер инференса с батчингом · генерация — vLLM","key":"b_mlsd_arch_2"},{"text":"Отказы\nзависимость упала → что видит пользователь","kind":"warn","key":"b_mlsd_arch_3"},{"text":"LLM: безопасность\nперсональные данные · инъекции · утечка промпта · передача человеку","kind":"warn","key":"b_mlsd_arch_4"}],"side":[{"text":"Пример (курс)\nхейт-фильтр: в LLM идут известные нарушители, остальное — простая модель","at":1,"kind":"ctx"}]},{"id":"launch","title":"7. Запуск и жизнь после","blocks":[{"text":"Тень\nновая модель считает рядом, ответ не показываем","key":"b_mlsd_launch_0"},{"text":"A/B\nединица рандомизации · длительность от мощности · защитные · условие остановки","key":"b_mlsd_launch_1"},{"text":"Раскатка\nпостепенно; часть трафика остаётся на старом","key":"b_mlsd_launch_2"},{"text":"Мониторинг\nсдвиг данных · качество · оповещения · откат","key":"b_mlsd_launch_3"},{"text":"Обратная связь\nошибки с прода → эталон и дообучение","kind":"idea","key":"b_mlsd_launch_4"}],"side":[{"text":"Ловушки\nновизна · общие ресурсы · один сплит на все эксперименты","at":1,"kind":"warn"},{"text":"Без A/B — фейл\nофлайн-метрика не повод выкатывать (MADE)","at":1,"kind":"idea"}]},{"id":"wrap","title":"8. Итог","blocks":[{"text":"Узкие места\nгде сломается при росте","key":"b_mlsd_wrap_0"},{"text":"Компромиссы\nчто выбрал и чем заплатил","key":"b_mlsd_wrap_1"},{"text":"MVP и вторая версия\nчто сейчас, что отложил","key":"b_mlsd_wrap_2"},{"text":"Смены условия\nинтервьюер меняет вводные → назад к этапу 1","kind":"ctx","key":"b_mlsd_wrap_3"}]},{"id":"n1","title":"Что с человеком при каждой ошибке","blocks":[{"text":"FP в спаме\nнормальное сообщение исчезло, человек не узнает","key":"b_mlsd_n1_0"},{"text":"FN в срочных\nклиент с украденной картой не получил помощь","key":"b_mlsd_n1_1"}]},{"id":"n2","title":"Какая ошибка дороже","blocks":[{"text":"Спам\nFP дороже, цель recall при precision ≥ 99%","key":"b_mlsd_n2_0"},{"text":"Срочные обращения\nFN дороже, цель recall при precision ≥ 30%","key":"b_mlsd_n2_1"},{"text":"Мошенничество\nобе дороги, два порога: блок и мягкое действие","key":"b_mlsd_n2_2"}]},{"id":"n3","title":"Что даёт крайность","blocks":[{"text":"Скрыть всё\nrecall 100%, precision около 10%","key":"b_mlsd_n3_0"},{"text":"Не показывать никому\nотписок ноль, охват ноль","key":"b_mlsd_n3_1"}]},{"id":"n4","title":"Приёмка одной строкой","blocks":[{"text":"Быстрый счёт\nдопустимо X ошибок на N скрытых значит precision ≥ 1 − X/N","key":"b_mlsd_n4_0"}]},{"id":"n5","title":"Лестница моделей","blocks":[{"text":"Без ML\nправила, самый частый класс: нижняя планка на эталоне","key":"b_mlsd_n5_0"},{"text":"Линейная регрессия\nчисло на выходе; MAE и RMSE против среднего","key":"b_mlsd_n5_1"},{"text":"Логистическая регрессия\nда или нет; precision и recall на пороге, PR-AUC; калибровка","key":"b_mlsd_n5_2"},{"text":"Мультикласс\nsoftmax, классы исключают друг друга; macro-F1, recall по классам","key":"b_mlsd_n5_3"},{"text":"Multi-label\nсигмоида на метку; precision и recall по каждой метке","key":"b_mlsd_n5_4"},{"text":"TF-IDF + логрегрессия\nсильный бейзлайн для текста; разбор ошибок по примерам","key":"b_mlsd_n5_5"},{"text":"Дообученный энкодер\nкогда TF-IDF упёрся в смысл; прирост на том же сплите","key":"b_mlsd_n5_6"},{"text":"Гибрид и каскад\nRecall@K пула отдельно от Hit@5 и MRR верха","key":"b_mlsd_n5_7"}]},{"id":"n6","title":"Лестница моделей","blocks":[{"text":"Без ML\nправила, самый частый класс: нижняя планка на эталоне","key":"b_mlsd_n6_0"},{"text":"Линейная регрессия\nчисло на выходе; MAE и RMSE против среднего","key":"b_mlsd_n6_1"},{"text":"Логистическая регрессия\nда или нет; precision и recall на пороге, PR-AUC; калибровка","key":"b_mlsd_n6_2"},{"text":"Мультикласс\nsoftmax, классы исключают друг друга; macro-F1, recall по классам","key":"b_mlsd_n6_3"},{"text":"Multi-label\nсигмоида на метку; precision и recall по каждой метке","key":"b_mlsd_n6_4"},{"text":"TF-IDF + логрегрессия\nсильный бейзлайн для текста; разбор ошибок по примерам","key":"b_mlsd_n6_5"},{"text":"Дообученный энкодер\nкогда TF-IDF упёрся в смысл; прирост на том же сплите","key":"b_mlsd_n6_6"},{"text":"Гибрид и каскад\nRecall@K пула отдельно от Hit@5 и MRR верха","key":"b_mlsd_n6_7"}]},{"id":"n7","title":"Классы: исключают или пересекаются","blocks":[{"text":"Да или нет\nодна метка, мошенничество или нет; одна сигмоида, BCE, порог","key":"b_mlsd_n7_0"},{"text":"Ровно один из многих\nтип обращения: карта, кредит, вклад; softmax, сумма равна 1, cross-entropy, macro-F1","key":"b_mlsd_n7_1"},{"text":"Одна из многих или не знаю\nsoftmax и порог уверенности; ниже порога человеку","key":"b_mlsd_n7_2"},{"text":"Несколько сразу\nмошенничество и угроза в одном сообщении; сигмоида на метку, BCE, порог на каждую метку","key":"b_mlsd_n7_3"},{"text":"Много редких классов\none-vs-rest, отдельный бинарный логрег на класс; свой порог и свои precision и recall","key":"b_mlsd_n7_4"},{"text":"Softmax на пересекающихся\nмодель выберет одну метку и потеряет вторую","kind":"warn","key":"b_mlsd_n7_5"},{"text":"Multi-label на исключающих\nполучишь «ни одной» или «все три», придётся чинить правилами","kind":"warn","key":"b_mlsd_n7_6"}]},{"id":"n8","title":"Лестница моделей","blocks":[{"text":"Без ML\nправила, самый частый класс: нижняя планка на эталоне","key":"b_mlsd_n8_0"},{"text":"Линейная регрессия\nчисло на выходе; MAE и RMSE против среднего","key":"b_mlsd_n8_1"},{"text":"Логистическая регрессия\nда или нет; precision и recall на пороге, PR-AUC; калибровка","key":"b_mlsd_n8_2"},{"text":"Мультикласс\nsoftmax, классы исключают друг друга; macro-F1, recall по классам","key":"b_mlsd_n8_3"},{"text":"Multi-label\nсигмоида на метку; precision и recall по каждой метке","key":"b_mlsd_n8_4"},{"text":"TF-IDF + логрегрессия\nсильный бейзлайн для текста; разбор ошибок по примерам","key":"b_mlsd_n8_5"},{"text":"Дообученный энкодер\nкогда TF-IDF упёрся в смысл; прирост на том же сплите","key":"b_mlsd_n8_6"},{"text":"Гибрид и каскад\nRecall@K пула отдельно от Hit@5 и MRR верха","key":"b_mlsd_n8_7"}]},{"id":"n9","title":"Классы: исключают или пересекаются","blocks":[{"text":"Да или нет\nодна метка, мошенничество или нет; одна сигмоида, BCE, порог","key":"b_mlsd_n9_0"},{"text":"Ровно один из многих\nтип обращения: карта, кредит, вклад; softmax, сумма равна 1, cross-entropy, macro-F1","key":"b_mlsd_n9_1"},{"text":"Одна из многих или не знаю\nsoftmax и порог уверенности; ниже порога человеку","key":"b_mlsd_n9_2"},{"text":"Несколько сразу\nмошенничество и угроза в одном сообщении; сигмоида на метку, BCE, порог на каждую метку","key":"b_mlsd_n9_3"},{"text":"Много редких классов\none-vs-rest, отдельный бинарный логрег на класс; свой порог и свои precision и recall","key":"b_mlsd_n9_4"},{"text":"Softmax на пересекающихся\nмодель выберет одну метку и потеряет вторую","kind":"warn","key":"b_mlsd_n9_5"},{"text":"Multi-label на исключающих\nполучишь «ни одной» или «все три», придётся чинить правилами","kind":"warn","key":"b_mlsd_n9_6"}]},{"id":"n10","title":"Головы и лоссы","blocks":[{"text":"Редкий класс тонет в лёгких нулях\n1 из 100: модель «всегда нет» почти не штрафуется, редкую метку не замечает","kind":"idea","key":"b_mlsd_n10_0"},{"text":"Вес или focal\npos_weight ≈ нулей / единиц (99 при 1 из 100); focal приглушает лёгкие нули; берут что-то одно","key":"b_mlsd_n10_1"},{"text":"Калибровка\nвеса завышают вероятности, 0,8 ≠ 80%; изотоническая регрессия или Платт, отдельно на каждую метку","key":"b_mlsd_n10_2"},{"text":"Порог по PR-кривой\nсвой порог на метку, на калиброванной вероятности; recall при ограничении precision","key":"b_mlsd_n10_3"},{"text":"Проверка\nrecall и precision на закрытом наборе; калибровку и порог на отложенной выборке, не на обучающей","key":"b_mlsd_n10_4"},{"text":"Порог вместо весов\nмодель редкий класс почти не видела, сдвиг порога поднимет и шум","kind":"warn","key":"b_mlsd_n10_5"},{"text":"Высокий скор = хорошо ловит\nэто показывают precision и recall, а не само число","kind":"warn","key":"b_mlsd_n10_6"},{"text":"Фраза для собеса\nредкий класс: BCE с весом или focal, потом калибровка на отложенной, потом свой порог по PR-кривой, проверка на закрытом наборе","kind":"num","key":"b_mlsd_n10_7"}]}]},{"id":"raif-mlsd","group":"raif","title":"Райф · MLSD: риск бизнеса","source":"career/learn/raif/mlsd_business_risk.md. Числа — допущения для обсуждения, не факты о банке.","levels":[{"id":"top","title":"Маршрут на 45 минут","blocks":[{"text":"1. Рамки: продукт + инженерия\nкто решает и что · нагрузка, пик, SLA, можно ли наружу","open":"frame","next":"зафиксировал","key":"b_raif-mlsd_top_0"},{"text":"2. Метрики и цена ошибок\nбизнес · защитные · нагрузка · по слоям","open":"metric","next":"чем мерить — ясно","key":"b_raif-mlsd_top_1"},{"text":"3. Источники и идентификация\nсначала ИНН, потом всё остальное","open":"src","next":"объект установлен","key":"b_raif-mlsd_top_2"},{"text":"4. Пайплайн\nфон + запрос, событие с цитатой","open":"pipe","next":"как доказать качество","key":"b_raif-mlsd_top_3"},{"text":"5. Разметка и оценка\nпрокси-метка из реестров, оценка по слоям","open":"data","next":"следующий уровень","key":"b_raif-mlsd_top_4"},{"kind":"warn","text":"6. Запуск · стоимость · мониторинг · риски\nсюда дойти САМОМУ — этого не хватило в прошлый раз","open":"launch","key":"b_raif-mlsd_top_5"}]},{"id":"frame","title":"Постановка","blocks":[{"kind":"ctx","text":"Бизнес и продукт\nаналитик проверки контрагентов · решает: нужна ли углублённая проверка\nспросить: что дороже — пропуск или лишняя проверка","next":"посчитать нагрузку","key":"b_raif-mlsd_frame_0"},{"kind":"num","text":"Инженерные рамки\n1000 проверок/сутки ≈ 0,01 RPS — нагрузка не узкое место · пик — спросить\np95 ≤ 3 мин → фон + запрос · LLM внутри банка → цена в токенах (этап 6)","next":"«риск вообще» не разметить","key":"b_raif-mlsd_frame_1"},{"text":"Раскладываю риск\nфинансовый · правовой · комплаенс · репутация · качество данных","next":"выбираю решение","key":"b_raif-mlsd_frame_2"},{"text":"Таргет MVP\nнужна ли углублённая проверка установленному контрагенту","next":"выход","key":"b_raif-mlsd_frame_3"},{"text":"Выход — досье\nсущность · события с цитатой · связи · пробелы · приоритет и основания","next":"с чего начать","key":"b_raif-mlsd_frame_4"},{"kind":"idea","text":"Baseline без ML\nЕГРЮЛ → ИНН → правила → шаблонный отчёт\nуже продукт и источник разметки","key":"b_raif-mlsd_frame_5"}]},{"id":"metric","title":"Метрики","blocks":[{"text":"Бизнес\nвремя аналитика: медиана 35 → 15 мин · стоимость проверки","next":"но не ценой качества","key":"b_raif-mlsd_metric_0"},{"text":"Защитные\nrecall существенного ≥ 95% · привязка к лицу ≥ 99,5%","next":"и не завалить очередь","key":"b_raif-mlsd_metric_1"},{"text":"Нагрузка\nprecision эскалаций ≥ 70% при ёмкости 60/день","next":"precision или recall?","key":"b_raif-mlsd_metric_2"},{"kind":"num","text":"100 существенных на 10 тыс.\nrecall 95% → 95 находок\nP 50% → 190 алертов · P 10% → 950","next":"и честность чисел","key":"b_raif-mlsd_metric_3"},{"kind":"warn","text":"190 из 200 = 95%, но интервал 91–97%\n0 ошибок на 3000 → ≤ 0,1%\nбутстрап по компаниям","key":"b_raif-mlsd_metric_4"}]},{"id":"src","title":"Источники и идентификация","blocks":[{"text":"Реестры\nЕГРЮЛ · Прозрачный бизнес · ГИР БО · ЕФРСБ · КАД · ФССП","next":"плюс","key":"b_raif-mlsd_src_0"},{"text":"Агрегаторы и СМИ\nСПАРК / Контур.Фокус · ленты · поисковый API","next":"фильтр","key":"b_raif-mlsd_src_1"},{"kind":"warn","text":"Доступно ≠ можно ≠ доказывает\nToS, 152-ФЗ · суд ≠ СМИ ≠ пресс-релиз","next":"сердце задачи","key":"b_raif-mlsd_src_2"},{"text":"Идентификация\nназвание → кандидаты → ИНН\nФИО → только кандидаты, иначе «неоднозначно»","next":"владельцы","key":"b_raif-mlsd_src_3"},{"text":"Граф владения\nкто → роль → с кем → доля → период → источник\n60% × 70% = 42%","next":"граница","key":"b_raif-mlsd_src_4"},{"kind":"warn","text":"Упёрлись в лимит обхода\n«раскрыто не полностью», а не «владельцев нет»","key":"b_raif-mlsd_src_5"}]},{"id":"pipe","title":"Пайплайн","blocks":[{"text":"Фон\nконнекторы → S3 → парсинг/OCR → дедуп → индекс → события → досье","next":"по запросу","key":"b_raif-mlsd_pipe_0"},{"text":"Запрос\nсущность → кэш → добор поиском → привязка → извлечение → склейка → отчёт","next":"длинные документы","key":"b_raif-mlsd_pipe_1"},{"text":"Чанкинг\nструктурный ~800/120 · критичное — читать целиком, top-K ≠ полнота","next":"дубли","key":"b_raif-mlsd_pipe_2"},{"text":"Дедуп — три объекта\nдокументы (хеш) · перепечатки (MinHash) · события (поля)","next":"модели","key":"b_raif-mlsd_pipe_3"},{"text":"Модели\nBM25 + BGE-M3 → реранкер → LLM 8B по схеме с цитатой → правила/CatBoost","next":"отчёт","key":"b_raif-mlsd_pipe_4"},{"kind":"idea","text":"Отчёт: «иск 15 млн, компания — ответчик, решения нет, стр. 4»\nа не «должна 15 млн»","key":"b_raif-mlsd_pipe_5"}]},{"id":"data","title":"Разметка и оценка","blocks":[{"kind":"idea","text":"Прокси-метка из реестров\nснимок на дату T → банкротство / ликвидация за 12 мес","next":"ловушки","key":"b_raif-mlsd_data_0"},{"kind":"warn","text":"Утечка из будущего · выживаемость · незрелый горизонт","next":"плюс люди","key":"b_raif-mlsd_data_1"},{"text":"Разметка аналитиков\nинструкция · двое + арбитр · случайная + обогащённая выборка","next":"оценка","key":"b_raif-mlsd_data_2"},{"text":"Сплит\nпо компаниям и группам + по времени","next":"по слоям","key":"b_raif-mlsd_data_3"},{"kind":"num","text":"Потери перемножаются\n0,95 × 0,95 × 0,95 ≈ 0,86\nкачество LLM ≠ качество системы","key":"b_raif-mlsd_data_4"}]},{"id":"launch","title":"Запуск, стоимость, мониторинг","blocks":[{"text":"Тень 2–4 нед\nсравнение с независимым аудитом","next":"пилот","key":"b_raif-mlsd_launch_0"},{"text":"Пилот 5–10 аналитиков → сравнение\nnon-inferiority по качеству + меньше время","next":"сколько стоит","key":"b_raif-mlsd_launch_1"},{"kind":"num","text":"20 млн вх + 2 млн вых токенов/сутки\n≈ 230 / 23 ток/с · 8B на GPU 48 ГБ ×2","next":"что смотреть","key":"b_raif-mlsd_launch_2"},{"text":"Мониторинг\nисточники · пайплайн · качество · польза\nвыборка «чистых» досье еженедельно","next":"что может пойти не так","key":"b_raif-mlsd_launch_3"},{"kind":"warn","text":"Риски\nтёзки · галлюцинации · injection · источник упал ≠ «чисто» · 152-ФЗ ст. 16","key":"b_raif-mlsd_launch_4"}]}]},{"id":"my1","group":"own","title":"Выбор движка инференса","levels":[{"id":"top","title":"Выбор движка инференса","blocks":[{"text":"Сначала нагрузка и железо\nдвижок без условия как RAG без задачи","kind":"idea","open":"n1","key":"b_my1_top_0"},{"text":"vLLM, а не llama.cpp\nмного параллельных: continuous batching, PagedAttention","key":"b_my1_top_1"},{"text":"SGLang, а не vLLM\nобщий длинный промпт, многоходовые диалоги: RadixAttention","alt":true,"key":"b_my1_top_2"},{"text":"TensorRT-LLM, а не vLLM\nмодель надолго, NVIDIA, максимум пропускной","open":"n2","key":"b_my1_top_3"},{"text":"llama.cpp, а не vLLM\nодин пользователь, CPU, GGUF","alt":true,"key":"b_my1_top_4"}]},{"id":"n1","title":"Сначала нагрузка и железо","blocks":[{"text":"Пользователи → RPS\nв день × запросов ÷ 86 400 × пик","key":"b_my1_n1_0"},{"text":"RPS → одновременно\nRPS × время ответа","key":"b_my1_n1_1"},{"text":"Одновременно → память\nхватит ли KV, см. И1","key":"b_my1_n1_2"}]},{"id":"n2","title":"TensorRT-LLM, а не vLLM","blocks":[{"text":"Цена\nпересборка на каждую модель и GPU","kind":"warn","key":"b_my1_n2_0"}]}]},{"id":"my2","group":"own","title":"MLSD по-простому: вопросы к любому кейсу","levels":[{"id":"top","title":"MLSD по-простому: вопросы к любому кейсу","blocks":[{"text":"Рамки\nкто пользователь и что делает с результатом","open":"n1","key":"b_my2_top_0"},{"text":"Метрики\nкак бизнес поймёт, что работает","open":"n2","key":"b_my2_top_1"},{"text":"Постановка\nвыходы по одному","open":"n3","key":"b_my2_top_2"},{"text":"Данные\nоткуда правильный ответ","open":"n4","key":"b_my2_top_3"},{"text":"Модель\nсначала простое решение","key":"b_my2_top_4"},{"text":"Архитектура\nонлайн или очередь, что при отказе","key":"b_my2_top_5"},{"text":"Запуск и итог\nтень, A/B, мониторинг","key":"b_my2_top_6"}]},{"id":"n1","title":"Рамки","blocks":[{"text":"Продукт первым\nкто и что делает с результатом","key":"b_my2_n1_0"},{"text":"Не с нагрузки\nсначала продукт, потом числа","kind":"warn","key":"b_my2_n1_1"},{"text":"Худший сценарий\nспроси прямо: что хуже всего","key":"b_my2_n1_2"},{"text":"Нагрузка цепочкой\nсмена → в час → в сутки → пик","kind":"num","key":"b_my2_n1_3"}]},{"id":"n2","title":"Метрики","blocks":[{"text":"Главная\nв деньгах или минутах","key":"b_my2_n2_0"},{"text":"Защитная\nсторожит худший сценарий","kind":"idea","key":"b_my2_n2_1"},{"text":"Как накрутить главную?\nэто и ловит защитная","kind":"warn","key":"b_my2_n2_2"},{"text":"Без слова «позитив»\nздесь хороший и плохой исход","key":"b_my2_n2_3"}]},{"id":"n3","title":"Постановка","blocks":[{"text":"Разбей на выходы\nу каждого своя метрика","key":"b_my2_n3_0"},{"text":"Тип каждого выхода\nмультикласс, генерация, бинарная","key":"b_my2_n3_1"},{"text":"Позитив = что ищем\nдаже если для бизнеса плохо","kind":"warn","key":"b_my2_n3_2"},{"text":"Офлайн-метрика\nтот же вопрос, что у бизнеса","key":"b_my2_n3_3"}]},{"id":"n4","title":"Данные","blocks":[{"text":"Откуда эталон?\nможно ли верить старым меткам","key":"b_my2_n4_0"}]}]}],"bot":"learn322_bot"};

const byId = (id) => DATA.boards.find((b) => b.id === id);
const firstLine = (t) => t.split("\n")[0];
function opened(board, block) {
  if (!block.open) return null;
  const parts = block.open.includes("/") ? block.open.split("/") : [board.id, block.open];
  const target = byId(parts[0]);
  const level = target && target.levels.find((l) => l.id === parts[1]);
  return level ? { board: target, level: level } : null;
}
function up(board, level) {
  for (const b of DATA.boards.filter((x) => x.group === board.group)) {
    for (const l of b.levels) {
      if (l.blocks.some((k) => opened(b, k) && opened(b, k).board === board && opened(b, k).level === level)) return { board: b, level: l };
    }
  }
  return null;
}
const roots = DATA.boards.filter((b) => !up(b, b.levels[0]));
// Hand-written cheat-sheet pages of the same site: tiles on the home screen next to the maps.
const PAGES = [
  ["techsection.html", "Техсекция: Python, SQL, ряды, инференс", "Шпаргалка · 18 разделов: dict, GIL, ревью, SQL, окна, ряды"],
  ["tools.html", "Выбор инструмента MLSD", "Шпаргалка · от выхода к модели, лоссы, деревья, случайный лес"],
];

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function route() {
  const parts = decodeURIComponent(location.hash.slice(1)).split("/");
  const board = byId(parts[0]);
  const level = board && board.levels.find((l) => l.id === parts[1]);
  if (level) return { board: board, level: level };
  return roots.length === 1 ? { board: roots[0], level: roots[0].levels[0] } : null;
}

function renderTrail(at) {
  const trail = document.getElementById("trail");
  trail.replaceChildren();
  const chain = [];
  for (let x = at, hops = 0; x && hops < 20; x = up(x.board, x.level), hops++) chain.unshift(x);
  if (roots.length > 1) chain.unshift(null);
  chain.forEach((x, i) => {
    if (i > 0) trail.append(el("span", "sep", "›"));
    const label = x ? x.level.title : "Все карты";
    if (i === chain.length - 1) trail.append(el("b", "", label));
    else {
      const a = el("a", "", label);
      a.onclick = () => go(x, "out");
      trail.append(a);
    }
  });
}

// Bold only what reads as a result: «0,455 → 0,909», «74% → 87%», «+0,191», «318 мс», «2,4 млн». Whole numbers stay
// plain, and so do the digits of dates (2026-11-14), «Hit@5», «MR !128», «ai-host-03», «М3»: a page of numbers must not shout.
const FIG = /((?<![\p{L}\d@!#\/_.,:-])(?!(?<=\d[ \u00a0])\d{3}(?!\d))[+−]?\d+(?:[ \u00a0]\d{3})*(?:[.,]\d+)?(?:\s?(?:%|тыс\.|млн|млрд|мс|×))?(?:\s?→\s?[+−]?\d+(?:[ \u00a0]\d{3})*(?:[.,]\d+)?(?:\s?(?:%|тыс\.|млн|млрд|мс|×))?)?)(?![\p{L}\d_-])/u;
const RESULT = /[.,]\d|%|тыс|млн|млрд|мс|×|→/;
function figures(parent, text) {
  text.split(FIG).forEach((part, i) => {
    if (part) parent.append(i % 2 && RESULT.test(part) ? el("b", "fig", part) : document.createTextNode(part));
  });
  return parent;
}
const STEP_NO = /^(\d+)\.\s+/;
const TAGS = { idea: "зачем", warn: "ловушка", num: "замер", ctx: "контекст", ask: "вопрос" };
const kindOf = (item) => "kind-" + (item.kind || "step");
// A side card's colour from its label (start, hypothesis, offline, stand, online, business), else from its kind;
// a system or tool (ctx) is grey.
function toneOf(note, label) {
  const l = label.toLowerCase();
  if (l.startsWith("старт")) return "t-start";
  if (l.startsWith("гипотез")) return "t-hyp";
  if (l.startsWith("офлайн")) return "t-off";
  if (l.startsWith("стенд") || l.includes("на стенде")) return "t-stand";
  if (l.startsWith("онлайн")) return "t-on";
  if (l.startsWith("бизнес")) return "t-biz";
  if (note.kind === "ask") return "t-ask";
  if (note.kind === "warn") return "t-warn";
  if (note.kind === "idea") return "t-hyp";
  if (note.kind === "ctx") return "t-ctx";
  return "t-num";
}
const LEGEND = "Полоса слева: синяя — шаг, жёлтая — зачем, зелёная — замер, красная — ловушка, фиолетовая пунктиром — открытый вопрос.";

// The opened level drawn small: one level deep only, so the page stays light however deep the map grows.
const MINI = 8;
function miniSchema(inner) {
  const mini = el("div", "mini");
  const blocks = inner.level.blocks;
  blocks.slice(0, MINI).forEach((k, i) => {
    if (i > 0) mini.append(el("span", "to", k.alt ? "или" : "→"));
    const line = firstLine(k.text).replace(STEP_NO, "");
    mini.append(el("span", "box " + kindOf(k) + (opened(inner.board, k) ? " deeper" : ""), line.length > 48 ? line.slice(0, 47) + "…" : line));
  });
  if (blocks.length > MINI) mini.append(el("span", "more", "+" + (blocks.length - MINI)));
  return mini;
}

// 💬 talks about the block (start=b_…), ✏️ edits its text in words (start=e_…); the bot answers only its learners.
function talkLink(key, edit) {
  const talk = el("a", edit ? "talk edit" : "talk", edit ? "✏️" : "💬");
  talk.href = "tg://resolve?domain=" + DATA.bot + "&start=" + (edit ? "e_" + key.slice(2) : key);
  talk.title = edit ? "Поправить текст блока словами в Telegram" : "Обсудить этот блок с тьютором в Telegram";
  talk.onclick = (event) => event.stopPropagation();
  return talk;
}
function zoomable(card, board, block) {
  const inner = opened(board, block);
  if (!inner) return null;
  card.dataset.open = inner.board.id + "/" + inner.level.id;
  card.onclick = () => go(inner, "in", card);
  return inner;
}

function blockCard(board, block) {
  const card = el("div", "block " + kindOf(block));
  const lines = block.text.split("\n");
  if (TAGS[block.kind]) card.append(el("div", "tag", TAGS[block.kind]));
  card.append(figures(el("div", "head"), lines[0].replace(STEP_NO, "")));
  if (lines.length > 1) card.append(figures(el("div", "body"), lines.slice(1).join("\n")));
  const inner = zoomable(card, board, block);
  if (inner) {
    card.classList.add("opens");
    card.append(miniSchema(inner), el("div", "zoom", "⤢ Раскрыть: " + inner.level.title));
  }
  if (block.key && DATA.bot) card.append(talkLink(block.key), talkLink(block.key, true));
  return card;
}

// A block that opens another map (the legend's modules): a tile with its code and its chain of stages.
function tileCard(board, block) {
  const card = el("div", "tile");
  const lines = block.text.split("\n");
  const named = /^(\S{1,4})\.\s+(.+)$/.exec(lines[0]);
  if (named) card.append(el("span", "code", named[1]));
  card.append(el("div", "title", named ? named[2] : lines[0]));
  if (lines[1]) {
    const chain = el("div", "chain");
    lines[1].split("→").forEach((part, i) => {
      if (i > 0) chain.append(el("span", "to", "→"));
      chain.append(el("span", "chip", part.trim()));
    });
    card.append(chain);
  }
  const inner = zoomable(card, board, block);
  if (inner) {
    const side = (inner.level.side || []).length;
    card.append(el("div", "meta", inner.level.blocks.length + " этапов" + (side ? " · " + side + " карточек метрик" : "")));
  }
  if (block.key && DATA.bot) card.append(talkLink(block.key));
  return card;
}

function metricCard(note) {
  const lines = note.text.split("\n");
  const card = el("div", "metric " + toneOf(note, lines[0]));
  card.append(el("div", "label", lines[0]));
  if (lines.length > 1) card.append(figures(el("div", "val"), lines.slice(1).join("\n")));
  return card;
}

function render(at) {
  const main = el("main");
  if (!at) {
    main.append(el("h1", "", "Карты"));
    const list = el("div", "tiles");
    roots.forEach((b) => list.append(tileCard(b, { text: b.title, open: b.id + "/" + b.levels[0].id, key: "" })));
    PAGES.forEach(([href, title, chain]) => {
      const card = el("a", "tile");
      card.href = href;
      card.append(el("div", "title", title), el("div", "meta", chain));
      list.append(card);
    });
    main.append(list);
  } else {
    main.append(el("h1", "", at.level.title));
    const source = at.level.source || at.board.source;
    if (source) main.append(el("div", "source", source));
    const blocks = at.level.blocks;
    if (blocks.every((block) => block.open && block.open.includes("/"))) {
      const list = el("div", "tiles");
      blocks.forEach((block) => list.append(tileCard(at.board, block)));
      main.append(list);
    } else {
      // Side notes (metrics, start, hypothesis) stand in a column beside their stage; on a phone, under it.
      const side = at.level.side || [];
      if (side.length) main.classList.add("wide");
      // Steps numbered in their text («1. …»): a block without a number is a note, not a step — a dot.
      const numbered = blocks.some((block) => STEP_NO.test(firstLine(block.text)));
      // A block with «alt» stands beside the one before it: a fork on one row.
      const rows = [];
      blocks.forEach((block, i) => (block.alt && rows.length ? rows[rows.length - 1].push(i) : rows.push([i])));
      rows.forEach((indexes, r) => {
        const block = blocks[indexes[0]];
        const row = el("div", "row" + (r === 0 ? " first" : "") + (r === rows.length - 1 ? " last" : ""));
        const rail = el("div", "rail");
        const number = STEP_NO.exec(firstLine(block.text));
        const label = number ? number[1] : numbered ? "" : String(r + 1);
        rail.append(el("div", "badge " + kindOf(block) + (label ? "" : " dot"), label));
        const flow = el("div", "flow");
        if (indexes.length === 1) flow.append(blockCard(at.board, block));
        else {
          const fork = el("div", "fork");
          indexes.forEach((i, j) => fork.append(...(j ? [el("div", "or", "или")] : []), blockCard(at.board, blocks[i])));
          flow.append(fork);
        }
        if (block.next && r < rows.length - 1) flow.append(el("div", "next", "↓ " + block.next));
        row.append(rail, flow);
        const mine = side.filter((note) => indexes.includes(note.at || 0));
        if (mine.length) {
          const notes = el("div", "notes");
          mine.forEach((note) => notes.append(metricCard(note)));
          row.append(notes);
        }
        main.append(row);
      });
    }
    main.append(el("div", "hint", (DATA.bot
      ? "Карточка с «⤢ Раскрыть» — внутри своя схема, нажми, и она откроется на весь экран. 💬 — разговор о блоке в боте, ✏️ — поправить его текст словами; после него «🧩 Разложить в схему» растит уровень глубже. "
      : "Карточка с «⤢ Раскрыть» — внутри своя схема, нажми, и она откроется на весь экран. ")
      + LEGEND + " Справа (на телефоне — под шагом) — метрики этапа, серым — системы и инструменты. Esc — на уровень выше."));
  }
  document.getElementById("app").replaceChildren(main);
  renderTrail(at);
  window.scrollTo(0, 0);
  return main;
}

let current = route();
function go(to, direction, from) {
  const before = current;
  const swap = () => {
    current = to;
    history.pushState(null, "", to ? "#" + to.board.id + "/" + to.level.id : "#");
    const main = render(to);
    if (direction === "in") main.style.viewTransitionName = "zoom";
    if (direction === "out" && before) {
      const card = main.querySelector('[data-open="' + before.board.id + "/" + before.level.id + '"]');
      if (card) card.style.viewTransitionName = "zoom";
    }
  };
  if (!document.startViewTransition) return swap();
  if (direction === "in" && from) from.style.viewTransitionName = "zoom";
  if (direction === "out") document.querySelector("main").style.viewTransitionName = "zoom";
  // The name must sit on one element per state: cleared once the zoom is over, before the next click.
  document.startViewTransition(swap).finished.finally(() => {
    document.querySelectorAll("main, .block, .tile").forEach((node) => { node.style.viewTransitionName = ""; });
  });
}
window.addEventListener("popstate", () => { current = route(); render(current); });
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape" || !current) return;
  const parent = up(current.board, current.level);
  if (parent) go(parent, "out");
  else if (roots.length > 1) go(null, "out");
});
render(current);
</script>
</body>
</html>
