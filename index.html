<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта обучения</title>
<style>
:root { --ink: #1b1f24; --muted: #667085; --line: #d9dee5; --open: #1c7ed6; --bg: #f3f5f8; --card: #fff; --rail: #c5d5ea; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, "Segoe UI", Arial, sans-serif; }
#trail { position: sticky; top: 0; z-index: 2; padding: 10px 16px; background: rgba(255, 255, 255, .92); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line); font-size: 14px; }
#trail a { color: var(--open); text-decoration: none; cursor: pointer; }
#trail span.sep { color: var(--muted); margin: 0 6px; }
#tools { position: fixed; top: 6px; right: 12px; z-index: 3; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--open); font-size: 14px; text-decoration: none; }
main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 64px; }
h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 4px; letter-spacing: -.01em; }
.source { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
/* Kind of a block: one muted accent for its stripe, ring and tag — the logic step, why, measure, trap, open question,
   context. Colour only marks the kind; the text stays ink, so a long map does not shout. */
.kind-step { --accent: #4a6fa5; } .kind-idea { --accent: #b8892b; } .kind-warn { --accent: #c0504d; }
.kind-num { --accent: #4a8a5c; } .kind-ask { --accent: #8467b8; } .kind-ctx, .kind-plain { --accent: #8a94a3; }
.fig { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* The flow: a rail with stage numbers, the steps, the metrics of each stage beside it. */
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 16px; }
main.wide .row { grid-template-columns: 40px minmax(0, 1fr) 340px; column-gap: 20px; }
.rail { position: relative; display: flex; justify-content: center; }
.rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--rail); }
.row.first .rail::before { top: 26px; }
.row.last .rail::before { bottom: auto; height: 26px; }
.row.first.last .rail::before { display: none; }
.badge { position: relative; margin-top: 10px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); color: var(--accent); border: 2px solid var(--accent); font-weight: 700; font-size: 15px;
  box-shadow: 0 0 0 4px var(--bg); }
/* Not a step of the flow (a note among numbered steps): a dot instead of a number. */
.rail .badge.dot { width: 12px; height: 12px; margin-top: 21px; }
.flow { min-width: 0; padding-bottom: 16px; }
.block { position: relative; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: 12px; padding: 12px 52px 12px 16px; box-shadow: 0 1px 2px rgba(16, 24, 40, .06); }
.block.kind-ask { border-left-style: dashed; }
.block .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.block .head { font-weight: 650; font-size: 17px; }
.block .body { white-space: pre-line; margin-top: 4px; color: #344054; }
.block.opens { cursor: zoom-in; transition: box-shadow .15s, transform .15s; }
.block.opens:hover { box-shadow: 0 6px 18px rgba(28, 126, 214, .18); transform: translateY(-1px); }
/* A fork: two ways through one stage (classic ML or LLM), «или» between them. */
.fork { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: stretch; }
.fork .or { align-self: center; font-size: 13px; font-weight: 600; color: var(--muted); }
.next { margin: 8px 0 0 4px; font-size: 13px; color: var(--muted); font-style: italic; }
/* What sits inside a block: its level drawn small; the whole card zooms in. */
.mini { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; padding: 10px; border-radius: 10px;
  background: #f1f3f6; }
.mini .box { font-size: 12px; line-height: 1.25; background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 6px; padding: 3px 7px; max-width: 220px; }
.mini .box.deeper { border-color: var(--open); border-left-color: var(--accent); box-shadow: inset 0 0 0 1px var(--open); }
.mini .to { color: #98a2b3; font-weight: 700; font-size: 13px; }
.mini .more { font-size: 12px; color: var(--muted); }
.block .zoom { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--open); }
.talk { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%;
  background: #fff; border: 1px solid var(--line); text-decoration: none; font-size: 17px; }
.talk:hover { background: #e7f5ff; border-color: var(--open); }
/* ✏️ under 💬: smaller, the block grows tall enough to hold both. */
.talk.edit { top: 48px; width: 30px; height: 30px; right: 10px; font-size: 14px; }
.block:has(.edit) { min-height: 88px; }
/* Metrics of a stage: a card with a thin coloured top and its label; systems and tools — grey, flat. */
.notes { display: grid; gap: 10px; align-content: start; position: relative; padding-bottom: 16px; }
.notes::before { content: ""; position: absolute; left: -20px; top: 26px; width: 20px; border-top: 2px dashed var(--rail); }
.metric { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--tone); border-radius: 12px; padding: 9px 12px;
  box-shadow: 0 1px 2px rgba(16, 24, 40, .06); }
.metric .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--tone); }
.metric .val { white-space: pre-line; font-size: 14px; margin-top: 3px; color: #344054; }
.metric .fig { font-size: 15px; }
.metric.t-ctx { background: #f7f8fa; box-shadow: none; }
.metric.t-ask { border-top-style: dashed; }
.t-start { --tone: #6b7280; } .t-hyp { --tone: #b8892b; } .t-off { --tone: #3d8a84; } .t-stand { --tone: #6b84a8; }
.t-on { --tone: #5b6bb5; } .t-biz { --tone: #b06a35; } .t-warn { --tone: #c0504d; } .t-ask { --tone: #8467b8; }
.t-num { --tone: #4a8a5c; } .t-ctx { --tone: #8a94a3; }
/* A level of whole maps (the legend): tiles. */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.tile { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 52px 14px 16px;
  cursor: zoom-in; box-shadow: 0 1px 2px rgba(16, 24, 40, .06); transition: box-shadow .15s, transform .15s; }
.tile:hover { box-shadow: 0 8px 22px rgba(28, 126, 214, .18); transform: translateY(-2px); }
.tile .code { display: inline-block; font-weight: 800; font-size: 13px; color: #fff; background: var(--open); border-radius: 8px; padding: 2px 8px; }
.tile .title { font-weight: 650; font-size: 18px; margin: 6px 0 8px; }
.tile .chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tile .chip { font-size: 13px; background: #eef4fc; border-radius: 999px; padding: 2px 9px; }
.tile .to { color: #98a2b3; font-weight: 700; }
.tile .meta { margin-top: 10px; font-size: 12px; color: var(--muted); }
a.tile { display: block; color: inherit; text-decoration: none; }
.hint { color: var(--muted); font-size: 13px; margin-top: 20px; }
@media (max-width: 760px) {
  /* One column: the step, its metrics under it, then the next step. */
  main { padding: 14px 16px 48px; }
  h1 { font-size: 22px; }
  .row, main.wide .row { grid-template-columns: 30px minmax(0, 1fr); column-gap: 10px; }
  .rail { grid-row: 1 / span 2; }
  .row:has(.notes) .flow { padding-bottom: 8px; }
  .notes { grid-column: 2; }
  .notes::before { display: none; }
  .badge { width: 28px; height: 28px; font-size: 13px; margin-top: 12px; }
  .row.first .rail::before { top: 26px; }
  .tiles { grid-template-columns: 1fr; }
  .fork { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .fork .or { justify-self: center; }
  /* The inner schema scrolls sideways instead of stacking into a tower. */
  .mini { flex-wrap: nowrap; overflow-x: auto; }
  .mini .box { flex: 0 0 auto; max-width: 170px; }
}
::view-transition-group(zoom) { animation-duration: .45s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
</style>
</head>

<script>const DATA = {"boards":[{"id":"broker-mlsd","group":"broker","title":"Брокер · MLSD: агент для клиентов","source":"Кейс по каркасу mlsd (этапы 1–8, на 5-м — ветка «LLM и агент»). Разбор: career/learn/broker_ai/mlsd_agents.md. Числа масштаба — спросить у интервьюера, не называть.","levels":[{"id":"top","title":"Маршрут на 75 минут","blocks":[{"text":"1. Рамки · 15 мин\nвиды запросов по цене ошибки · нагрузка, пик, задержка","open":"biz","next":"чем мерить","key":"b_broker-mlsd_top_0"},{"text":"2. Метрики и приёмка\nбизнес · защитные · критерий","open":"metric","next":"что строим","key":"b_broker-mlsd_top_1"},{"text":"3. Постановка · 10 мин\nбез LLM → намерение и риск → действие по риску","open":"setup","next":"на чём проверять","key":"b_broker-mlsd_top_2"},{"text":"4. Данные и офлайн-оценка · 25 мин\nэталон, траектория, судья с калибровкой","open":"data","next":"как устроен агент","key":"b_broker-mlsd_top_3"},{"text":"5. Модель: конвейер агента\nworkflow: маршрут + инструменты + проверка","open":"frame","next":"как работает в проде","key":"b_broker-mlsd_top_4"},{"text":"6. Архитектура и отказы · 20 мин\nправа в коде, операции через подтверждение","open":"arch","next":"как выкатить","key":"b_broker-mlsd_top_5"},{"kind":"warn","text":"7. Запуск · A/B · мониторинг\nдойти САМОМУ — для высокого грейда обязательно","open":"launch","next":"итог","key":"b_broker-mlsd_top_6"},{"kind":"ask","text":"8. Итог и смены условия\nMVP · внешний API · без подтверждения · 300 мс · нет разметки","open":"change","key":"b_broker-mlsd_top_7"}],"side":[{"kind":"warn","at":0,"text":"Первые 10 минут — ни слова о модели\nтолько пользователь, цена ошибки, метрика"}]},{"id":"biz","title":"1. Рамки: бизнес и пользователь","blocks":[{"kind":"ask","text":"Бизнес и продукт\nкто пишет: клиент в приложении или сейлз · что считается решённым","key":"b_broker-mlsd_biz_0"},{"kind":"ask","text":"Инженерные рамки\nобращений в день → пиковый RPS · задержка канала (чат / голос) · цена запроса\nсколько операторов · своя модель или API","key":"b_broker-mlsd_biz_1"},{"text":"Справка · цена низкая\nтариф, как работает ИИС → база знаний со ссылкой","key":"b_broker-mlsd_biz_2"},{"text":"Мой счёт · цена средняя\nкомиссия, дивиденды → числа только из инструментов","key":"b_broker-mlsd_biz_3"},{"kind":"warn","text":"Операция · цена высокая\nпродай, выведи → черновик, клиент подтверждает","key":"b_broker-mlsd_biz_4"},{"kind":"warn","text":"Рекомендация · регуляторная\nпо профилю из одобренного набора или к советнику","key":"b_broker-mlsd_biz_5"},{"text":"Вне зоны\nжалоба, спор, мошенничество → сразу человек","key":"b_broker-mlsd_biz_6"},{"kind":"idea","text":"Идеальная и худшая система\nхудшая: неверное число, не та бумага, чужие данные","key":"b_broker-mlsd_biz_7"}]},{"id":"metric","title":"2. Метрики и приёмка","blocks":[{"text":"Бизнес\nдоля без оператора («Run 0») · время до решения · CSAT","key":"b_broker-mlsd_metric_0"},{"kind":"warn","text":"Защитные\nошибки операций = 0 · числа не из инструментов · жалобы","key":"b_broker-mlsd_metric_1"},{"kind":"idea","text":"Повторное обращение за 24 ч\nловит «закрыл, но не решил»","key":"b_broker-mlsd_metric_2"},{"text":"Критерий приёмки\n0 неверных операций, справки не хуже оператора → max доля без оператора","key":"b_broker-mlsd_metric_3"}]},{"id":"setup","title":"3. Постановка","blocks":[{"kind":"idea","text":"Решение без LLM\nFAQ + кнопки + оператор; 3 кнопки закрывают много — сначала кнопки","key":"b_broker-mlsd_setup_0"},{"text":"Входы → выходы (таблица таргетов)\nвходы: текст или голос, профиль, портфель · выходы: вид запроса — мультикласс · передать человеку — бинарная + калибровка · параметры поручения (бумага, сторона, объём) — извлечение, проверка кодом","key":"b_broker-mlsd_setup_1"},{"text":"Действие по риску и уверенности\nсправка — сам · счёт — числа из инструментов · операция — черновик и подтверждение · не уверен или вне зоны — человек","key":"b_broker-mlsd_setup_2"},{"kind":"ctx","text":"Схема за минуту\nшлюз → намерение → инструменты → проверка → ответ · логи → эталон","key":"b_broker-mlsd_setup_3"}]},{"id":"data","title":"4. Данные и офлайн-оценка","blocks":[{"text":"Данные\nлоги операторов (маскировать ПДн) · база знаний с версиями · API систем","key":"b_broker-mlsd_data_0"},{"text":"Эталон по видам запросов\nупор на дорогие + трудные: «продай половину», инъекция, неквал","key":"b_broker-mlsd_data_1"},{"text":"Маршрутизация\nцена ошибок несимметрична: рекомендация → полнота ≈ 100%","key":"b_broker-mlsd_data_2"},{"text":"Траектория\nинструмент и аргументы проверяет код, без судьи","key":"b_broker-mlsd_data_3"},{"text":"Ответ\nчисла — код; тон и полнота — судья, откалиброванный на людях","key":"b_broker-mlsd_data_4"},{"kind":"num","text":"Стабильность и интервалы\nоперации — pass^k · бутстрап по диалогам","key":"b_broker-mlsd_data_5"}]},{"id":"frame","title":"5. Модель: конвейер агента","blocks":[{"kind":"idea","text":"Workflow, а не свободный агент\nшаги известны заранее и риск высок — шаги задаёт код, LLM внутри шага","key":"b_broker-mlsd_frame_0"},{"text":"Намерение и риск\nвид запроса + уверенность, жёсткая схема ответа","next":"маршрут","key":"b_broker-mlsd_frame_1"},{"text":"Маршрут\nсправка · счёт · операция · рекомендация · человек","next":"инструменты","key":"b_broker-mlsd_frame_2"},{"text":"Инструменты с узким контрактом\nget_portfolio · get_operations · draft_order · search_kb","next":"ответ","key":"b_broker-mlsd_frame_3"},{"text":"Ответ\nмодель объясняет, числа подставлены из инструментов","next":"проверка","key":"b_broker-mlsd_frame_4"},{"text":"Проверка до показа\nчисла сверены кодом · дисклеймер · нет рекомендации без профиля","key":"b_broker-mlsd_frame_5"},{"kind":"idea","text":"Чего агент НЕ делает\nисполнять без подтверждения · видеть чужой счёт · советовать вне набора","key":"b_broker-mlsd_frame_6"},{"kind":"ctx","text":"Из опыта\nдело из запроса, не от модели; запись — после подтверждения","key":"b_broker-mlsd_frame_7"},{"kind":"ctx","text":"Модели\nLLM со схемой → дистилляция в малый классификатор; дообучение — только при системной ошибке","key":"b_broker-mlsd_frame_8"}]},{"id":"arch","title":"6. Архитектура и отказы","blocks":[{"text":"Шлюз\nаутентификация, client_id из сессии, не из текста","key":"b_broker-mlsd_arch_0"},{"text":"Фильтр входа\nинъекции, маскирование ПДн","key":"b_broker-mlsd_arch_1"},{"kind":"warn","text":"Операция\nчерновик кодом → риск-проверки → кнопка клиента → исполнение","key":"b_broker-mlsd_arch_2"},{"kind":"idea","text":"Идемпотентность\nключ поручения: ретрай не создаёт вторую сделку","key":"b_broker-mlsd_arch_3"},{"kind":"num","text":"Задержка из канала\nчат — TTFT и стриминг; голос — ~1 с до речи (уточнить)","key":"b_broker-mlsd_arch_4"},{"kind":"ctx","text":"Из опыта\np95 TTFT 23,9 → 1,3 с: 4 слота, непрерывный батчинг","key":"b_broker-mlsd_arch_5"},{"text":"Отказ — закрытый\nLLM упала → кнопки и оператор; учёт упал → «не могу получить данные»","key":"b_broker-mlsd_arch_6"},{"text":"Журнал\nкаждый шаг, вызов, версия промпта и модели → аудит и оценка","key":"b_broker-mlsd_arch_7"}]},{"id":"launch","title":"7. Запуск, A/B, мониторинг","blocks":[{"text":"1. Тень\nагент отвечает параллельно оператору, клиенту не показываем","key":"b_broker-mlsd_launch_0"},{"text":"2. Подсказки оператору\nдоля ответов без правок = готовность","key":"b_broker-mlsd_launch_1"},{"text":"3. Клиентам: справка и счёт\nмалая доля трафика","key":"b_broker-mlsd_launch_2"},{"kind":"warn","text":"4. Операции — последними","key":"b_broker-mlsd_launch_3"},{"text":"A/B\nединица — клиент · основная — доля без оператора · защитные — CSAT, повторы","key":"b_broker-mlsd_launch_4"},{"kind":"warn","text":"Ловушки A/B\nновизна · общие операторы · «не пускает к оператору»","key":"b_broker-mlsd_launch_5"},{"text":"Мониторинг\nрезко — выкатка или зависимость; плавно — дрейф (тариф, продукт)","key":"b_broker-mlsd_launch_6"},{"kind":"ctx","text":"Регрессия в CI\nкаждая версия промпта и модели — через эталон; инцидент → новый тест","key":"b_broker-mlsd_launch_7"}]},{"id":"change","title":"8. Итог и смены условия","blocks":[{"text":"MVP и вторая версия\nMVP: справка и счёт; операции и рекомендации — позже, после тени","key":"b_broker-mlsd_change_0"},{"kind":"ask","text":"«Только внешний API»\nмаскировать ПДн, без счетов и ФИО; «мой счёт» — не через API","key":"b_broker-mlsd_change_1"},{"kind":"ask","text":"«Операции без подтверждения»\nтолько узкий класс по правилу клиента, лимиты, журнал, отмена","key":"b_broker-mlsd_change_2"},{"kind":"ask","text":"«Рекомендации — главное»\nрегулируемый модуль по профилю; LLM только объясняет решение","key":"b_broker-mlsd_change_3"},{"kind":"ask","text":"«Ответ за 300 мс»\nклассификатор + шаблоны с числами; LLM — только сложное","key":"b_broker-mlsd_change_4"},{"kind":"ask","text":"«Нет разметки»\nлоги операторов как слабая метка + 300–500 трудных вручную + тень","key":"b_broker-mlsd_change_5"}]}]},{"id":"legend","group":"legend","title":"Легенда: вся карта","source":"М1–М7: career/learn/beacon_cases/M1.md … M7.md; колоды legend-m1.json … legend-m7.json. М1–М4 — агентная система; М5–М7 — задачи платформы объявлений.","levels":[{"id":"top","title":"Легенда: семь модулей","blocks":[{"text":"М1. Проверка документов\nПакет → основания → заключение эксперта","open":"m1/top","key":"b_legend_top_0"},{"text":"М2. Контроль платежей\nГраф связей → сигнал → подтверждения","open":"m2/top","key":"b_legend_top_1"},{"text":"М3. Обучение агента\nИсправить среду → SFT → GSPO","open":"m3/top","key":"b_legend_top_2"},{"text":"М4. Инференс и выпуск\nКэш → скорость → проверка → откат","open":"m4/top","key":"b_legend_top_3"},{"text":"М5. Модерация объявлений\nПравило → модель → пороги → человек","open":"m5/top","key":"b_legend_top_4"},{"text":"М6. Поиск услуг\nОбучение E5 → кандидаты → ранкер","open":"m6/top","key":"b_legend_top_5"},{"text":"М7. Антифрод в переписке\nУчитель → ученик → предупреждение","open":"m7/top","key":"b_legend_top_6"}]}]},{"id":"m1","group":"legend","title":"М1: проверка документов перед траншем","source":"career/learn/beacon_cases/M1.md, ч. 5–11, 13, 15, 19; trainer/decks/legend-m1.json. Метрики и их условия: ч. 15.","levels":[{"id":"top","title":"М1: проверка документов перед траншем","blocks":[{"text":"Пакет и задача эксперта\nПроверить основания для транша, подготовить заключение","kind":"ctx","next":"какие документы доступны","open":"task","key":"b_m1_top_0"},{"text":"Подготовка документов\nРазбор и OCR, таблицы, объект, редакция и дата проверки","next":"ищем действующие основания","open":"documents","key":"b_m1_top_1"},{"text":"Поиск оснований\nBM25 + векторы → RRF → реранкер → кандидаты агенту","next":"где нужен следующий шаг","open":"retrieval","key":"b_m1_top_2"},{"text":"Проверки кодом и агентом\nКод считает суммы и даты; агент уточняет основания по прочитанному","next":"фиксируем подтверждения","open":"agent","key":"b_m1_top_3"},{"text":"Черновик и решение\nТекст только по зарегистрированным основаниям; ссылки проверяет код, утверждает эксперт","next":"проверяем пользу и качество","open":"grounding","key":"b_m1_top_4"},{"text":"Результат\nЦикл: 3 рабочих дня → 4 часа\nHit@10: 74% → 91%\nОхват после раскатки: 40 экспертов, 1 200 объектов","kind":"num","open":"evaluation","key":"b_m1_top_5"}],"side":[{"at":0,"text":"Бизнес: цикл пакета\nКонтроль: медиана 24 рабочих часа, p90 48 ч\nСодержательные доработки черновиков 36%"},{"at":0,"kind":"idea","text":"Гипотеза\nОснования находит поиск, суммы и даты считает код — эксперт тратит время на решение, а не на сбор пакета"},{"at":2,"text":"Офлайн: поиск\nHit@10 74 → 83 → 91%, MRR@10 0,55 → 0,73\nЗакрытый тест 1 200 вопросов; сканы 55 → 81%\nSLA: поиск 250–300 мс"},{"at":4,"text":"Офлайн: черновик\nСогласие судьи с людьми 0,9, каппа разметки 0,74\nЧерновик ≈12 → ≈5 мин"},{"at":5,"text":"Онлайн: пилот, апр–май 2025\nЦикл 4 ч против 24 ч, p90 13 против 48 ч\nДоработки 36% → 18% (ноя–дек 2025)\nЗащитная: ошибки аудита 6/120 против 8/120"}]},{"id":"task","title":"М1 · что именно решает RAG","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Короткий ответ: RAG находит внешние основания и передаёт их генератору. Знания в весах модели сами по себе не доказывают факт о текущем пакете.","kind":"plain","key":"b_m1_task_0"},{"text":"Вход — пакет объекта на дату проверки. Выход — черновик с основаниями и статусами проверок. Доступные документы и права задаёт сервер.","kind":"plain","key":"b_m1_task_1"},{"kind":"idea","text":"Почему не просто длинный промпт: архив больше контекста, редакции меняются, а лишние похожие документы повышают риск перепутать основания.","key":"b_m1_task_2"},{"text":"Baseline: манифест, шаблоны поисковых запросов, правила и расчёты кодом. ML нужен там, где формулировки и следующий шаг зависят от текста.","kind":"plain","key":"b_m1_task_3"},{"kind":"warn","text":"Поиск, извлечение факта и генерация — разные источники ошибок. Замена LLM не исправит отсутствие документа в индексе.","key":"b_m1_task_4"},{"text":"На собесе: сначала назови вход, выход и цену ошибки; затем объясни, какую неопределённость снимает поиск, код, агент и человек.","kind":"plain","key":"b_m1_task_5"}]},{"id":"documents","title":"М1 · OCR, чанки и редакции","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"OCR превращает изображение в текст. Порядок чтения и структура таблицы могут потеряться даже при правильном распознавании отдельных символов.","kind":"plain","key":"b_m1_documents_0"},{"text":"Чанк — единица поиска. Деление по разделам и строкам таблиц сохраняет смысл; метаданные связывают фрагмент с файлом, страницей, объектом и редакцией.","kind":"plain","key":"b_m1_documents_1"},{"kind":"idea","text":"Мелкие чанки точнее локализуют ответ, но теряют контекст; крупные несут больше шума и стоят дороже при реранкинге и генерации.","key":"b_m1_documents_2"},{"text":"Overlap сохраняет контекст на границе фрагментов, но создаёт дубли. При оценке нужно различать найденные чанки и независимые основания.","kind":"plain","key":"b_m1_documents_3"},{"kind":"warn","text":"Дата документа, время вступления в силу и время доступности системе различны. Нельзя подмешивать сведения, появившиеся после решения.","key":"b_m1_documents_4"},{"text":"Нет документа ≠ поиск не нашёл. Отсутствие устанавливает полный манифест и статус обработки файлов, а не низкий скор поиска.","kind":"plain","key":"b_m1_documents_5"}]},{"id":"retrieval","title":"М1 · как устроен поиск оснований","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"kind":"plain","text":"BM25: совпадение слов и точных идентификаторов. Почему он остаётся рядом с нейросетью?","open":"bm25","key":"b_m1_retrieval_0"},{"kind":"plain","text":"Dense: текст → вектор → похожие фрагменты. Что означает близость и чему учится эмбеддер?","open":"dense","key":"b_m1_retrieval_1"},{"kind":"plain","text":"RRF: объединить выдачи с разными шкалами скоров по позициям документов.","open":"rrf","key":"b_m1_retrieval_2"},{"kind":"plain","text":"Cross-encoder: совместно читает вопрос и фрагмент, переставляет уже найденный пул.","open":"reranker","key":"b_m1_retrieval_3"},{"kind":"plain","text":"Обучение поиска: позитивы, трудные и ложные негативы; сплит без утечки.","open":"searchtrain","key":"b_m1_retrieval_4"},{"kind":"warn","text":"Потолок реранкера задаёт полнота пула. В М1: по 50 из веток → до 100 уникальных → 10 агенту → до 8 оснований проверки.","key":"b_m1_retrieval_5"}]},{"id":"bm25","title":"М1 · BM25 на понимание","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Короткий ответ: BM25 оценивает лексическое совпадение запроса с документом. Он работает по инвертированному индексу: слово → список документов.","kind":"plain","key":"b_m1_bm25_0"},{"text":"IDF повышает вклад редкого термина: редкий номер договора различает документы лучше общего слова «договор».","kind":"plain","key":"b_m1_bm25_1"},{"text":"TF учитывает число вхождений с насыщением: десятое повторение полезно меньше первого. Длина документа нормируется, чтобы длинные тексты не выигрывали за объём.","kind":"plain","key":"b_m1_bm25_2"},{"kind":"idea","text":"Плюс: точные номера и термины. Минус: «повесить карниз» и «монтаж креплений» могут не иметь общих слов.","key":"b_m1_bm25_3"},{"kind":"warn","text":"Индексатор и запрос должны одинаково нормализовать идентификаторы. Если «17/24» распалось на части, ранжирование не восстановит исходный номер.","key":"b_m1_bm25_4"},{"text":"На собесе: BM25 нужен за точность по лексике; эмбеддер — за перефразы. Их скор нельзя складывать без учёта разных шкал.","kind":"plain","key":"b_m1_bm25_5"}]},{"id":"dense","title":"М1 · эмбеддинги и bi-encoder","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Эмбеддер превращает текст в числовой вектор. Bi-encoder кодирует запрос и документ отдельно; векторы документов можно вычислить заранее.","kind":"plain","key":"b_m1_dense_0"},{"text":"Косинус сравнивает направление: cos(q,d)=(q·d)/(||q||·||d||). При единичных нормах он равен скалярному произведению.","kind":"plain","key":"b_m1_dense_1"},{"kind":"ctx","text":"Учебный пример: одинаковое направление даёт cos=1, перпендикулярные векторы — 0. Это геометрия, а не вероятность правильного ответа.","key":"b_m1_dense_2"},{"text":"Близость определяется обучением и выбранной метрикой. Модель общей темы может сблизить продажу и ремонт, хотя для поиска услуг это разные намерения.","kind":"plain","key":"b_m1_dense_3"},{"kind":"idea","text":"Цена независимого кодирования — меньше взаимодействия слов запроса и документа. Это компенсирует дорогой cross-encoder на коротком списке.","key":"b_m1_dense_4"},{"kind":"warn","text":"Новый эмбеддер меняет пространство: переиндексируй документы и переключай согласованную пару «модель + индекс». Векторы разных версий не смешивают.","key":"b_m1_dense_5"}]},{"id":"rrf","title":"М1 · RRF без магии скоров","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"kind":"num","text":"Формула: RRF(d)=Σ 1/(k+rank_j(d)). Складываем вклады документа из каждой выдачи; отсутствующая ветка вклада не даёт.","key":"b_m1_rrf_0"},{"text":"Буквы: d — документ; j — ветка; rank — позиция от первой; k сглаживает разницу верхних позиций. В М1 k=60.","kind":"plain","key":"b_m1_rrf_1"},{"kind":"ctx","text":"Учебная подстановка с k кейса: позиции 1 и 2 дают 1/61+1/62≈0,0325. Позиции взяты для объяснения, не из журнала выдач.","key":"b_m1_rrf_2"},{"kind":"idea","text":"Почему RRF: порядок есть у обеих веток, а BM25 и cosine не имеют общей шкалы. Не требуется обучать веса слияния.","key":"b_m1_rrf_3"},{"kind":"warn","text":"RRF теряет величину разрыва скоров. Разница между очень уверенным и едва первым местом в нём не видна.","key":"b_m1_rrf_4"},{"text":"Альтернатива: калиброванная взвешенная сумма или обучаемое слияние при наличии разметки. В М6 весь пул идёт в ранкер — там достаточно объединения.","kind":"plain","key":"b_m1_rrf_5"}]},{"id":"reranker","title":"М1 · cross-encoder и потолок пула","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Cross-encoder читает запрос и документ вместе; attention связывает их слова. Он выдаёт скор релевантности пары, а не независимый вектор документа.","kind":"plain","key":"b_m1_reranker_0"},{"kind":"idea","text":"Совместное чтение точнее различает «подписан» и «не подписан», но требует отдельного прогона для каждой пары, поэтому дорого для всего архива.","key":"b_m1_reranker_1"},{"text":"Сначала дешёвый поиск формирует кандидатов, затем cross-encoder сортирует небольшой пул. Это разделение retrieval и ranking.","kind":"plain","key":"b_m1_reranker_2"},{"kind":"warn","text":"Реранкер не возвращает отсутствующий в пуле документ. Если полезный фрагмент не найден, улучшай индекс, фильтры или генерацию кандидатов.","key":"b_m1_reranker_3"},{"text":"Скор релевантности не гарантирует юридическую применимость. Объект, права, действующая редакция и дата ограничиваются кодом.","kind":"plain","key":"b_m1_reranker_4"},{"text":"На собесе: отдельно измерь полноту пула и качество верхних позиций. Иначе непонятно, где потерялось основание.","kind":"plain","key":"b_m1_reranker_5"}]},{"id":"searchtrain","title":"М1 · чему и на чём учить поиск","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Позитив — фрагмент, подтверждающий ответ на вопрос. Контакт, клик или принятая ссылка — разные наблюдения с разным шумом; нельзя считать их равными истине.","kind":"plain","key":"b_m1_searchtrain_0"},{"text":"Трудный негатив похож на позитив, но не решает задачу. Он учит различать близкие случаи, которые модель уже путает.","kind":"plain","key":"b_m1_searchtrain_1"},{"kind":"warn","text":"Непомеченный фрагмент может быть правильным. Ложный негатив отталкивает полезные тексты; нужны проверка, фильтры и маскирование альтернативных позитивов.","key":"b_m1_searchtrain_2"},{"text":"В М1 временную применимость закрывают фильтры. Старые почти одинаковые редакции не превращают автоматически в негативы: нужная разница может быть только в дате.","kind":"plain","key":"b_m1_searchtrain_3"},{"text":"Сплит по объектам не даёт запоминать один договор в train и test; временной срез исключает данные, которые ещё не были доступны на дату решения.","kind":"plain","key":"b_m1_searchtrain_4"},{"kind":"idea","text":"Дообучение полезно после проверки OCR, покрытия, фильтров и baseline. Если нужного текста нет в индексе, новый loss не поможет.","key":"b_m1_searchtrain_5"}]},{"id":"agent","title":"М1 · агент, workflow и инструменты","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Workflow — заранее заданные переходы. Агентный цикл выбирает следующее действие по наблюдению: например, искать соглашение после расхождения подрядчика.","kind":"plain","key":"b_m1_agent_0"},{"text":"Состояние хранит идентификаторы, результаты и зарегистрированные основания. Оно позволяет продолжить проверку и не полагаться на память длинного промпта.","kind":"plain","key":"b_m1_agent_1"},{"kind":"idea","text":"Отдельный эпизод на проверку уменьшает контекст, локализует ошибки и даёт понятную единицу оценки и обучения.","key":"b_m1_agent_2"},{"text":"Tool calling — структурированный запрос модели к коду. JSON-схема ограничивает формат аргументов; сервер дополнительно проверяет права и смысл значений.","kind":"plain","key":"b_m1_agent_3"},{"kind":"warn","text":"Правильный JSON не означает правильный инструмент. Ограничивай число вызовов, повторы, доступные операции и правила остановки.","key":"b_m1_agent_4"},{"text":"На собесе: если маршрут стабилен, перенеси его в код. Польза агентности доказывается сравнением с тем же поиском и фиксированным workflow.","kind":"plain","key":"b_m1_agent_5"}]},{"id":"grounding","title":"М1 · доказательства, галлюцинации, безопасность","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Grounding: содержательное утверждение опирается на доступный источник. Валидность ссылки и подтверждение смысла утверждения — разные проверки.","kind":"plain","key":"b_m1_grounding_0"},{"text":"Валидатор проверяет существование фрагмента, его получение в эпизоде, формат ссылки и согласованность вычислимых значений.","kind":"plain","key":"b_m1_grounding_1"},{"kind":"warn","text":"Даже настоящая ссылка может не подтверждать вывод. Нужны проверка соответствия утверждения источнику, полноты оснований и экспертная оценка.","key":"b_m1_grounding_2"},{"text":"Prompt injection: документ может содержать инструкцию модели. Документ — данные; он не должен менять правила, права и доступные инструменты.","kind":"plain","key":"b_m1_grounding_3"},{"text":"Отказ от вывода нужен, когда обязательных оснований нет или есть противоречия. Уверенный стиль текста не восполняет отсутствующее доказательство.","kind":"plain","key":"b_m1_grounding_4"},{"kind":"idea","text":"Человек утверждает результат, код считает суммы. Это границы полномочий: модель помогает собрать основания, но не распоряжается траншем.","key":"b_m1_grounding_5"}]},{"id":"evaluation","title":"М1 · как доказывать качество RAG","source":"M1.md, ч. 5–12, 15, 19; legend-m1.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"kind":"num","text":"Hit@k = вопросы с хотя бы одним допустимым фрагментом в top-k / все вопросы. Метрика отвечает: нашлось ли хотя бы что-то нужное?","key":"b_m1_evaluation_0"},{"text":"Recall@k = найденные релевантные элементы / все релевантные. Для нескольких обязательных оснований одного попадания Hit@k мало.","kind":"plain","key":"b_m1_evaluation_1"},{"kind":"ctx","text":"На 1 200 вопросах Hit@10: 74%→91%, то есть +17 п.п. Этот прирост включает изменения всей поисковой цепочки, а не только обучение эмбеддера.","key":"b_m1_evaluation_2"},{"text":"Абляция меняет один компонент при фиксированных данных и остальных этапах. Парное сравнение на тех же вопросах уменьшает влияние состава теста.","kind":"plain","key":"b_m1_evaluation_3"},{"kind":"warn","text":"3 дня→4 часа — время процесса с очередью и доработками. Выбор пилотных команд неслучаен, поэтому причинный эффект отделён не полностью.","key":"b_m1_evaluation_4"},{"text":"На собесе: назови знаменатель, период, baseline и защитные метрики. Метрики retrieval, качества черновика и времени процесса не подменяют друг друга.","kind":"plain","key":"b_m1_evaluation_5"}]}]},{"id":"m2","group":"legend","title":"М2: графовый контроль платежей","source":"career/learn/beacon_cases/M2.md, ч. 5–11, 13, 15, 19; trainer/decks/legend-m2.json. Метрики и их условия: ч. 15.","levels":[{"id":"top","title":"М2: графовый контроль платежей","blocks":[{"text":"Платёж и задача контроля\nНайти риск в связях, который не виден в отдельном платеже","kind":"ctx","next":"собираем связи","open":"time","key":"b_m2_top_0"},{"text":"Граф на дату решения\nКомпании, люди, договоры и платежи; время действия связи и время её появления в системе","next":"находим подозрительные цепочки","open":"graph","key":"b_m2_top_1"},{"text":"Детектор на шаблонах\nПараметризованные графовые запросы; параллельно обычным правилам, с дедупликацией","next":"сигнал требует доказательств","open":"patterns","key":"b_m2_top_2"},{"text":"Агент собирает основания\nГраф и документы — инструменты; чек-лист, суммы и ссылки проверяет код","next":"готовим карточку","open":"investigation","key":"b_m2_top_3"},{"text":"Карточка и решение контроля\nБольшая модель объясняет подтверждённые факты; платёж останавливает человек","next":"считаем подтверждённые сигналы","open":"decision","key":"b_m2_top_4"},{"text":"Результат за девять месяцев\n2,3 млн платежей в графе\n221 подтверждённый сигнал из 312\n1,8 млрд ₽ остановлено или возвращено — по журналу контроля","kind":"num","open":"evaluation","key":"b_m2_top_5"}],"side":[{"at":0,"text":"Старт: правила службы\nНа 60 закрытых исторических схемах правила ловят 19"},{"at":0,"kind":"idea","text":"Гипотеза\nРиск виден в связях: шаблоны на графе на дату решения найдут схемы, которых не видно в отдельном платеже"},{"at":2,"text":"Офлайн: детектор\nПолнота 52 из 60 против 19 из 60 у правил\nSLA: все шаблоны на платёж p95 ≈450 мс"},{"at":3,"text":"Офлайн: агент\nОбязательные основания 86%, без источника 1,4% (80 расследований)\nHit@10 поиска 90%; карточка ≈27 с при дедлайне 180 с"},{"at":5,"text":"Онлайн: янв–сен 2026\n312 сигналов, контроль подтвердил 221 (70,8%)\n≈1,7 сигнала в рабочий день\nНеподтверждённых ≈0,016% платежей — это не FPR"}]},{"id":"graph","title":"М2 · графовая модель и Neo4j","source":"M2.md, ч. 5–12, 15, 19; legend-m2.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Property graph: узлы — сущности, рёбра — типизированные отношения, свойства — атрибуты. Путь объясняет, через какие связи возник сигнал.","kind":"plain","key":"b_m2_graph_0"},{"text":"Сначала разрешение сущностей: одна компания должна иметь устойчивый ключ. Совпадение названия или адреса само по себе не доказывает тождество.","kind":"plain","key":"b_m2_graph_1"},{"kind":"idea","text":"Почему граф: запросы о нескольких переходах и типах связей естественно выражаются путями. Для простых агрегатов SQL часто достаточно.","key":"b_m2_graph_2"},{"text":"Cypher задаёт шаблон совпадений в графе. Индексы и ограничения ключей ускоряют поиск начальных узлов и защищают идентичность сущностей.","kind":"plain","key":"b_m2_graph_3"},{"kind":"warn","text":"Произвольный обход без лимитов может взорваться по числу путей. Ограничивай глубину, типы рёбер, время и размер ответа.","key":"b_m2_graph_4"},{"text":"На собесе: Neo4j хранит и обходит связи. Детектор задают шаблоны; наличие графовой БД не означает обучение GNN.","kind":"plain","key":"b_m2_graph_5"}]},{"id":"time","title":"М2 · два времени и утечка будущего","source":"M2.md, ч. 5–12, 15, 19; legend-m2.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Время действия: когда связь была верна в мире. Время знания: когда система узнала о связи. Они могут сильно отличаться.","kind":"plain","key":"b_m2_time_0"},{"text":"Запрос «на дату» учитывает оба ограничения. Связь, действовавшая раньше, но загруженная позже решения, недоступна историческому детектору.","kind":"plain","key":"b_m2_time_1"},{"kind":"warn","text":"Обычный timestamp обновления не восстанавливает историю. Исправление записи не должно бесследно перезаписывать предыдущую версию.","key":"b_m2_time_2"},{"text":"Воспроизводимый сигнал хранит дату решения, версии источников и шаблона. Без них новый запуск нельзя честно сравнить с исходным.","kind":"plain","key":"b_m2_time_3"},{"kind":"idea","text":"Backtest имитирует знания на момент решения. Если использовать сегодняшний справочник контрагентов, получишь завышенное качество.","key":"b_m2_time_4"},{"text":"На собесе: проверяй не только временной split, но и доступность каждого признака. Даже train прошлого года может содержать сведения из будущего.","kind":"plain","key":"b_m2_time_5"}]},{"id":"patterns","title":"М2 · шаблоны, причинность и baseline","source":"M2.md, ч. 5–12, 15, 19; legend-m2.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Шаблон — проверяемая комбинация связей, сумм и временных окон. Он выдаёт подозрительный путь и причину срабатывания.","kind":"plain","key":"b_m2_patterns_0"},{"kind":"idea","text":"При малой и неоднородной разметке правила проще проверить и объяснить. Более сложная модель оправдана только выигрышем на независимой оценке.","key":"b_m2_patterns_1"},{"text":"Порог подбирают на dev под допустимую нагрузку контроля и ошибки. Подбор и итоговый отчёт на одном наборе завышают результат.","kind":"plain","key":"b_m2_patterns_2"},{"kind":"warn","text":"Совпадение адреса или общий человек — сигнал для проверки, а не доказательство схемы. Корреляция связей не доказывает злой умысел.","key":"b_m2_patterns_3"},{"text":"Параллельные ветки «обычные правила» и «граф» должны покрывать один разрешённый поток. Сигналы объединяют по идентификатору операции.","kind":"plain","key":"b_m2_patterns_4"},{"text":"На собесе: сравни добавочные сигналы графа, совпадения с правилами и пропуски. Само число срабатываний не показывает полезность.","kind":"plain","key":"b_m2_patterns_5"}]},{"id":"investigation","title":"М2 · детектор отдельно от агента","source":"M2.md, ч. 5–12, 15, 19; legend-m2.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Детектор массово и воспроизводимо находит кандидатов. Агент разбирает уже выбранный сигнал и ищет подтверждающие документы.","kind":"plain","key":"b_m2_investigation_0"},{"kind":"idea","text":"Разделение снижает цену: дорогой текстовый разбор нужен не каждому платежу. Источник срабатывания остаётся проверяемым.","key":"b_m2_investigation_1"},{"text":"Обязательный чек-лист задаёт, что нужно подтвердить или отметить ненайденным. Набор документов не должен зависеть только от убедительности рассказа модели.","kind":"plain","key":"b_m2_investigation_2"},{"text":"Права и дата подставляются сервером; модель выбирает лишь разрешённый запрос. Суммы и связи сверяются с ответами инструментов.","kind":"plain","key":"b_m2_investigation_3"},{"kind":"warn","text":"Это графовый детектор плюс агентный сбор оснований. Microsoft GraphRAG с сообществами и сводками — другой механизм.","key":"b_m2_investigation_4"},{"text":"На собесе: обучение агента не делает детектор обучаемым. В М2 используется адаптер М3, отдельно обученного графового классификатора нет.","kind":"plain","key":"b_m2_investigation_5"}]},{"id":"decision","title":"М2 · надёжность обработки сигнала","source":"M2.md, ч. 5–12, 15, 19; legend-m2.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Идемпотентность: повтор одного события не создаёт повторного эффекта. Ключ платежа используется для дедупликации сигнала.","kind":"plain","key":"b_m2_decision_0"},{"text":"Повторная доставка возможна даже при исправной очереди: обработчик мог записать результат, но не подтвердить сообщение до сбоя.","kind":"plain","key":"b_m2_decision_1"},{"kind":"idea","text":"Надёжный путь: зафиксировать результат и состояние обработки согласованно, а внешние эффекты отправлять с ключом операции.","key":"b_m2_decision_2"},{"text":"Бюджет повторов общий для запроса: вложенные retry на каждом слое перемножают нагрузку и могут усугубить отказ зависимости.","kind":"plain","key":"b_m2_decision_3"},{"kind":"warn","text":"Отсутствие ответа инструмента не означает отсутствие риска. Покажи неполноту данных и передай решение контролю.","key":"b_m2_decision_4"},{"text":"На собесе: агент готовит карточку. Исполнение, возврат и приостановка платежа — отдельные полномочия службы контроля.","kind":"plain","key":"b_m2_decision_5"}]},{"id":"evaluation","title":"М2 · precision, пропуски и сумма денег","source":"M2.md, ч. 5–12, 15, 19; legend-m2.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"kind":"num","text":"Precision = подтверждённые сигналы / все сигналы. Буквы TP/(TP+FP): сколько найденных тревог подтвердил контроль.","key":"b_m2_evaluation_0"},{"text":"Recall = TP/(TP+FN): сколько всех реальных случаев нашёл детектор. Для него нужны сведения о пропущенных случаях, а не только разбор срабатываний.","kind":"plain","key":"b_m2_evaluation_1"},{"kind":"num","text":"В кейсе: 221/312≈70,8% подтверждений. Эти данные сами по себе не дают recall: неизвестен полный знаменатель всех опасных операций.","key":"b_m2_evaluation_2"},{"text":"Selection bias: разметка только тревог не представляет весь поток. Нужен независимый аудит части несработавших операций.","kind":"plain","key":"b_m2_evaluation_3"},{"kind":"warn","text":"1,8 млрд ₽ — уникальные остановленные или возвращённые суммы из журнала контроля. Это не оценка предотвращённого ущерба и не отдельный эффект LLM.","key":"b_m2_evaluation_4"},{"text":"На собесе: покажи период, пересечение с правилами, стоимость проверки сигнала и определения подтверждения. Сумму операций не суммируют по числу тревог.","kind":"plain","key":"b_m2_evaluation_5"}]}]},{"id":"m3","group":"legend","title":"М3: дообучение агента","source":"Легенда маяка / Сбер / М3; «М3 — подробный разбор», ч. 6, 8, 9, 19. Учебные числа (ε = 0,2, пример с разностями logprob) — для наглядности.","levels":[{"id":"top","title":"М3: дообучение агента","blocks":[{"text":"1. Сначала среда\nчиним кодом то, что не модель","next":"остались ошибки модели","open":"environment","key":"b_m3_top_0"},{"text":"2. Данные\n6 тыс. исправленных траекторий и контрпримеров","next":"учим на них","open":"data","key":"b_m3_top_1"},{"text":"3. SFT\n«повторяй за учителем»\n74% → 87%","open":"sft","next":"формат держит, итог не всегда","key":"b_m3_top_2"},{"text":"4. GSPO\n«пробуй сам, закрепляй удачное»\n87% → 93%","open":"gspo","next":"как это доказать","key":"b_m3_top_3"},{"kind":"num","text":"5. Честные замеры\ntest 74% → 87% → 93%\nбой 36% → 18% доработок — эффект всего релиза","open":"evaluation","key":"b_m3_top_4"}],"side":[{"at":0,"text":"Старт\nБазовая 30B с промптом: 222 из 300 (74%) на test\nВозвраты пилота: 288 из 800 (36%), из них 43 — поведение агента"},{"at":0,"kind":"idea","text":"Гипотеза\nПосле починки кодом агент всё ещё теряет идентификаторы и останавливается рано — это лечит обучение, а не промпт"},{"at":2,"text":"Офлайн: SFT\n261 из 300; зависимый шаг 73 из 90; документа нет 38 из 45"},{"at":3,"text":"Офлайн: SFT + GSPO\n279 из 300; зависимый шаг 82 из 90\nВызовов на успех 5,1 → 4,6; после FP8 277 из 300"},{"at":4,"kind":"warn","text":"Онлайн: весь выпуск\nДоработки 36% → 18%, но менялись и поиск, и генератор\nTest — гейт выпуска, не прогноз бизнеса"}]},{"id":"sft","title":"М3 · SFT изнутри","blocks":[{"text":"1. Что на входе\nтраектория: ходы модели + ответы инструментов","next":"не всё в ней — работа модели","key":"b_m3_sft_0"},{"text":"2. Маска\nштрафуем только свои ходы (≈6% токенов), остальное — контекст","next":"на этих токенах считаем ошибку","open":"mask","key":"b_m3_sft_1"},{"text":"3. Loss\nкросс-энтропия: насколько уверенно модель угадала верный токен","next":"что именно двигаем","open":"cross-entropy","key":"b_m3_sft_2"},{"text":"4. LoRA\nучим не модель, а надстройку 53 МБ; эксперты и router не трогаем","next":"где можно ошибиться","open":"lora","key":"b_m3_sft_3"},{"kind":"warn","text":"5. Ловушка\nмаска у Qwen3 может тихо съехать → смотреть токены глазами","next":"что получили","open":"optimization","key":"b_m3_sft_4"},{"kind":"num","text":"6. Итог\n74% → 87% на той же 30B, ~9 ч на 4 H100","key":"b_m3_sft_5"}]},{"id":"gspo","title":"М3 · GSPO изнутри","blocks":[{"kind":"warn","text":"1. Зачем отбор\nпосле SFT на своих задачах 8 из 8 → награды равны → учить нечем","next":"берём «средние» задачи","open":"rl-basics","key":"b_m3_gspo_0"},{"text":"2. 8 попыток на задачу\nиз 3000 задач оставили 620, где успех 1–7 из 8","next":"каждую попытку оцениваем","key":"b_m3_gspo_1"},{"text":"3. Награда за итог\nверно: 1 − 0,05·стоимость; ошибка или отказ: 0","next":"сравниваем внутри группы","open":"reward","key":"b_m3_gspo_2"},{"text":"4. Преимущество и шаг\nлучше среднего — вверх, хуже — вниз, но не дальше коридора","open":"gspo-math","next":"почему именно GSPO","key":"b_m3_gspo_3"},{"kind":"idea","text":"5. Почему не GRPO\nв MoE эксперты переключаются → по токенам шум; одно число на эпизод, как и награда","next":"что получили","key":"b_m3_gspo_4"},{"kind":"num","text":"6. Итог\n87% → 93%: сломал 7 из 261, исправил 25 из 39","key":"b_m3_gspo_5"}]},{"id":"gspo-math","title":"GSPO · формулы на числах","blocks":[{"kind":"num","text":"1. Преимущество\nA = (R − R̄) / σ\nR = 0,983, R̄ = 0,489, σ = 0,489 → A ≈ +1","next":"насколько сдвинулась модель","key":"b_m3_gspo-math_0"},{"kind":"num","text":"2. Отношение на эпизод\ns = exp(среднее [ln π_new − ln π_old])\nразности 0,1; 0,2; −0,1; 0,2 → s = e^0,1 ≈ 1,105","next":"зачем логарифм","key":"b_m3_gspo-math_1"},{"text":"3. Логарифм на пальцах\nln(a/b) = ln a − ln b: «во сколько раз» → «на сколько»; обратно — exp","next":"собираем цель","key":"b_m3_gspo-math_2"},{"kind":"num","text":"4. Цель\nmin(s·A, clip(s, 1−ε, 1+ε)·A)\nA = +1, s = 1,3, ε = 0,2 → min(1,3; 1,2) = 1,2","next":"в работе коридор уже","key":"b_m3_gspo-math_3"},{"kind":"warn","text":"5. Честно\nу меня ε = 3e-4 вниз и 4e-4 вверх, как в статье GSPO; 0,2 — учебное","open":"policy-update","key":"b_m3_gspo-math_4"}]},{"id":"policy-update","title":"М3 · отношения вероятностей и clipping","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. https://arxiv.org/html/2507.18071v2 Учебные примеры не являются замерами кейса.","blocks":[{"text":"Old policy породила попытки; текущая policy уже меняется на шагах обучения. Отношение вероятностей учитывает этот сдвиг при повторном использовании попыток.","kind":"plain","key":"b_m3_policy-update_0"},{"text":"В GSPO s=exp(среднее log p_new−log p_old) по токенам ответа. Это нормированное по длине отношение последовательности, не обычное произведение всех отношений.","kind":"plain","key":"b_m3_policy-update_1"},{"kind":"idea","text":"Нормировка по длине удерживает масштаб отношения. При малых изменениях s близко к единице, поэтому рабочие границы clipping гораздо уже учебных.","key":"b_m3_policy-update_2"},{"text":"При положительном advantage clipping обрезает выгоду чрезмерного роста вероятности; при отрицательном — выгоду чрезмерного уменьшения.","kind":"plain","key":"b_m3_policy-update_3"},{"kind":"ctx","text":"Учебный пример: A=−1, s=0,7, ε=0,2 → min(−0,7; −0,8)=−0,8. Знак A важен; нельзя заменять min обычным ограничением s во всех случаях.","key":"b_m3_policy-update_4"},{"kind":"warn","text":"Old policy для отношения и reference policy для KL-регуляризации — разные роли. Не приписывай кейсу KL-штраф, если его применение не зафиксировано.","key":"b_m3_policy-update_5"}]},{"id":"distributed","title":"М3 · обучение на нескольких GPU","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"DDP держит реплику модели на каждом устройстве и синхронизирует градиенты. Он увеличивает суммарный батч и throughput, но не делит вес каждой реплики.","kind":"plain","key":"b_m3_distributed_0"},{"text":"FSDP шардирует параметры, градиенты и состояния оптимизатора между устройствами; нужные веса собираются для вычисления слоя.","kind":"plain","key":"b_m3_distributed_1"},{"kind":"idea","text":"Обмены и сборка весов стоят времени. Выбор определяется памятью и скоростью на реальных длинах последовательностей, а не количеством GPU само по себе.","key":"b_m3_distributed_2"},{"text":"Gradient checkpointing не сохраняет часть активаций и пересчитывает их на backward: меньше память, больше вычислений.","kind":"plain","key":"b_m3_distributed_3"},{"text":"Mixed precision использует более компактные форматы для части операций. Проверяй численную устойчивость; bf16 обучения и FP8 serving — разные режимы.","kind":"plain","key":"b_m3_distributed_4"},{"kind":"warn","text":"Накопление градиентов не создаёт негативы между микробатчами автоматически. Для контрастивного loss большой эффективный батч требует специальной реализации.","key":"b_m3_distributed_5"}]},{"id":"environment","title":"М3 · прежде чем обучать модель","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Раздели ошибку данных, среды и поведения. Если документ не разобран или инструмент принимает неверный ID, обучение закрепит обход дефекта, а не решит причину.","kind":"plain","key":"b_m3_environment_0"},{"text":"Baseline — та же модель с хорошим промптом, исправленными инструментами и лимитами. Иначе эффект исправления кода будет приписан обучению.","kind":"plain","key":"b_m3_environment_1"},{"text":"SFT учит воспроизводить показанные ответы. RL меняет вероятность собственных действий по результату эпизода; это разные источники обучающего сигнала.","kind":"plain","key":"b_m3_environment_2"},{"kind":"idea","text":"Выбирай минимальное средство: правило → контракт инструмента → промпт → данные и обучение. Для стабильного вычисления нейросеть не нужна.","key":"b_m3_environment_3"},{"kind":"warn","text":"Среда обучения и serving должны совпадать по токенизатору, шаблону чата, инструментам и трактовке завершения. Иначе учится другой агент.","key":"b_m3_environment_4"},{"text":"На собесе: объясни оставшуюся ошибку модели и почему она воспроизводима. «Дообучил, потому что можно» — слабая постановка.","kind":"plain","key":"b_m3_environment_5"}]},{"id":"data","title":"М3 · траектории и утечки","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Траектория — последовательность контекста, действий модели, ответов инструментов и завершения. Эталон должен соответствовать состоянию среды.","kind":"plain","key":"b_m3_data_0"},{"text":"В кейсе 4 500 исправленных траекторий + 1 500 контрпримеров = 6 тыс. Контрпример меняет условие и требует проверить новый правильный результат.","kind":"plain","key":"b_m3_data_1"},{"text":"Teacher forcing: на обучении следующий токен предсказывается по правильному предыдущему контексту. При применении модель видит собственные ошибки.","kind":"plain","key":"b_m3_data_2"},{"kind":"warn","text":"Это расхождение объясняет, почему малый SFT loss не гарантирует успех длинного эпизода. Проверяй реальное исполнение инструментов.","key":"b_m3_data_3"},{"text":"Разделяй похожие задачи и источники между train/dev/test до генерации вариантов. Иначе контрпример обучающей задачи утечёт в тест.","kind":"plain","key":"b_m3_data_4"},{"text":"На собесе: назови единицу примера, происхождение меток, правила фильтрации и заморозку test. Число токенов не равно числу независимых задач.","kind":"plain","key":"b_m3_data_5"}]},{"id":"mask","title":"М3 · маска и языковое моделирование","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Causal LM предсказывает следующий токен по предыдущим. Маска attention запрещает читать будущие токены; маска loss выбирает, какие ответы оцениваются.","kind":"plain","key":"b_m3_mask_0"},{"text":"У SFT агента текст пользователя и ответы инструментов нужны как контекст, но не являются целевым поведением модели. Их метки исключают из loss.","kind":"plain","key":"b_m3_mask_1"},{"kind":"num","text":"Формула: L=−Σ m_t·ln pθ(y_t|y_\u003ct,x) / Σ m_t. m_t=1 для обучаемого ответа, 0 для контекста.","key":"b_m3_mask_2"},{"text":"Смысл: усредняем ошибку только по целевым токенам. В кейсе это около 6% последовательности; остальные токены всё ещё влияют через контекст.","kind":"plain","key":"b_m3_mask_3"},{"kind":"warn","text":"Учебный пример: 100 токенов, 6 целевых — делим сумму loss на 6, а не на 100. Это иллюстрация доли, не измеренная длина эпизода.","key":"b_m3_mask_4"},{"text":"Проверка глазами: декодируй токены с ненулевой маской, границы ролей, конец tool call и stop-токены. Сдвиг меток может не вызвать ошибки запуска.","kind":"plain","key":"b_m3_mask_5"}]},{"id":"cross-entropy","title":"М3 · logits, softmax и cross-entropy","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Logit — неограниченный скор токена. Softmax превращает скоры словаря в вероятности, сумма которых равна единице.","kind":"plain","key":"b_m3_cross-entropy_0"},{"kind":"num","text":"Формула: p_i=exp(z_i)/Σ exp(z_j); для правильного токена y: L=−ln p_y. Чем увереннее верный ответ, тем меньше ошибка.","key":"b_m3_cross-entropy_1"},{"text":"Буквы: z — logits; i,j — токены словаря; y — верный следующий токен. Градиент по logit равен p_i−1[i=y].","kind":"plain","key":"b_m3_cross-entropy_2"},{"kind":"ctx","text":"Учебный расчёт: p_y=0,8 → L≈0,223; p_y=0,2 → L≈1,609. Вероятности взяты для понимания формулы, не из замеров кейса.","key":"b_m3_cross-entropy_3"},{"text":"Обратное распространение вычисляет градиенты; оптимизатор делает шаг по ним. LoRA меняет набор обучаемых весов, но не смысл cross-entropy.","kind":"plain","key":"b_m3_cross-entropy_4"},{"kind":"warn","text":"Token loss и успех задачи различны. Модель может точно повторять стиль, но выбрать неверный документ; нужен eval полного эпизода.","key":"b_m3_cross-entropy_5"}]},{"id":"lora","title":"М3 · LoRA: что меняется в весах","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. https://arxiv.org/abs/2106.09685 Учебные примеры не являются замерами кейса.","blocks":[{"kind":"num","text":"Формула: W′=W+(α/r)BA. Базовая матрица W заморожена; обучаются небольшие матрицы A и B, задающие поправку низкого ранга.","key":"b_m3_lora_0"},{"text":"Буквы: r — ранг поправки, α — масштаб. Для W размера d_out×d_in число параметров поправки r(d_in+d_out), а не d_out·d_in.","kind":"plain","key":"b_m3_lora_1"},{"kind":"ctx","text":"Учебный пример: W размером 100×100 и r=4 → 800 параметров вместо 10 тыс. Это учебные размеры, не архитектура Qwen из кейса.","key":"b_m3_lora_2"},{"kind":"idea","text":"Экономятся обучаемые параметры, их градиенты и состояния оптимизатора. Базовые веса и активации всё равно занимают память.","key":"b_m3_lora_3"},{"kind":"warn","text":"LoRA не равна квантованию. Ранг и целевые слои — гиперпараметры; нельзя обещать одинаковое качество для любой задачи и любого ранга.","key":"b_m3_lora_4"},{"text":"При обычном линейном применении поправку можно слить в W для serving. После слияния и FP8 качество проверяют заново.","kind":"plain","key":"b_m3_lora_5"}]},{"id":"optimization","title":"М3 · как распознать плохое обучение","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Learning rate задаёт масштаб шага. Слишком большой разрушает полезное поведение, слишком малый почти не меняет модель.","kind":"plain","key":"b_m3_optimization_0"},{"text":"Батч определяет, по скольким примерам усредняется градиент. Накопление градиентов увеличивает эффективный батч при ограниченной памяти.","kind":"plain","key":"b_m3_optimization_1"},{"text":"Train loss падает, dev портится — признак переобучения или сдвига распределения. Решение выбирается по dev; test остаётся для итогового сравнения.","kind":"plain","key":"b_m3_optimization_2"},{"kind":"idea","text":"Перед дорогим запуском проверь, может ли модель переобучиться на маленьком наборе. Если нет — ищи дефект маски, данных или обновления весов.","key":"b_m3_optimization_3"},{"kind":"warn","text":"Смотри не только loss: градиенты, NaN, длину ответов, валидность вызовов и полный успех эпизода. Быстрое падение loss бывает следствием утечки.","key":"b_m3_optimization_4"},{"text":"На собесе: зафиксируй seed, версии данных и конфигурацию. Один удачный запуск не доказывает устойчивость улучшения.","kind":"plain","open":"distributed","key":"b_m3_optimization_5"}]},{"id":"rl-basics","title":"М3 · policy gradient и смысл GSPO","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. https://arxiv.org/html/2507.18071v2 Учебные примеры не являются замерами кейса.","blocks":[{"text":"Политика — распределение вероятностей действий модели. RL увеличивает вероятность действий из успешных попыток и уменьшает из неуспешных.","kind":"plain","key":"b_m3_rl-basics_0"},{"text":"Return — итоговая награда эпизода. Advantage показывает результат относительно опоры: положительный — лучше сравнения, отрицательный — хуже.","kind":"plain","key":"b_m3_rl-basics_1"},{"text":"Групповой baseline сравнивает попытки одной задачи. При одинаковых результатах мало полезного сигнала, поэтому нужны задачи с разными исходами.","kind":"plain","key":"b_m3_rl-basics_2"},{"kind":"idea","text":"SFT даёт стартовое поведение; RL исследует собственные варианты. Если все попытки неуспешны, разреженная награда тоже почти нечему учит.","key":"b_m3_rl-basics_3"},{"kind":"warn","text":"Clipping ограничивает вклад слишком большого изменения отношения вероятностей в целевую функцию. Это не жёсткий запрет любого изменения модели.","key":"b_m3_rl-basics_4"},{"text":"GRPO использует токенные отношения, GSPO — нормированное по длине отношение последовательности. В кейсе нет полного доказательства превосходства над GRPO.","kind":"plain","key":"b_m3_rl-basics_5"}]},{"id":"reward","title":"М3 · награда и reward hacking","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Reward — то, что оптимизатор реально улучшает. Если наградить красивый текст, агент может научиться убеждать без выполнения задачи.","kind":"plain","key":"b_m3_reward_0"},{"text":"В кейсе проверяющий код оценивает конечное состояние: статус, основания, значения и отсутствие запрещённых действий.","kind":"plain","key":"b_m3_reward_1"},{"kind":"num","text":"R=1−0,05·cost при успехе; R=0 при ошибке или отказе. Смысл cost и его нормировка должны быть зафиксированы заранее.","key":"b_m3_reward_2"},{"text":"Стоимость различает успешные маршруты, а не заменяет правильность. Иначе короткий неверный ответ мог бы стать выгоднее полного решения.","kind":"plain","key":"b_m3_reward_3"},{"kind":"warn","text":"Агент может эксплуатировать дырку в проверяющем коде. Держи отдельные задачи, ограничения инструментов и ручной аудит подозрительно лёгких успехов.","key":"b_m3_reward_4"},{"text":"На собесе: поясни, кто проверяет успех и как среда защищена от обхода. Растущая средняя награда ещё не доказывает рост качества.","kind":"plain","key":"b_m3_reward_5"}]},{"id":"evaluation","title":"М3 · парные сравнения и причинный вклад","source":"M3.md, ч. 5–12, 15, 19; legend-m3.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Сравнивай промпт, SFT и SFT+GSPO на одинаковых закрытых задачах и с одинаковыми инструментами. Это отделяет эффект этапов.","kind":"plain","key":"b_m3_evaluation_0"},{"kind":"num","text":"На 300 задачах: 222→261→279 успехов, то есть 74%→87%→93%. SFT добавил 13 п.п.; следующий этап — ещё 6 п.п.","key":"b_m3_evaluation_1"},{"text":"Парная таблица показывает не только итоговую сумму. После GSPO исправлено 25 ошибок, сломано 7 верных решений: чистый прирост 18 задач.","kind":"plain","key":"b_m3_evaluation_2"},{"kind":"warn","text":"Улучшение test не переносится автоматически в production. После слияния адаптера, квантования и смены среды нужен тот же гейт.","key":"b_m3_evaluation_3"},{"text":"Возвраты 36%→18% измеряют весь выпуск с новым поиском, генератором и агентом. Их нельзя приписать одному SFT или складывать с офлайн-приростами.","kind":"plain","key":"b_m3_evaluation_4"},{"text":"На собесе: назови единицу успеха, закрытый набор, контрольную руку, исправленные и сломанные случаи и границы переноса в бой.","kind":"plain","key":"b_m3_evaluation_5"}]}]},{"id":"m4","group":"legend","title":"М4: инференс и выпуск моделей","source":"career/learn/beacon_cases/M4.md, ч. 5–11, 13, 15, 19; trainer/decks/legend-m4.json. Метрики и их условия: ч. 15.","levels":[{"id":"top","title":"М4: инференс и выпуск моделей","blocks":[{"text":"Две роли моделей\nQwen3-30B-A3B выбирает действия; Qwen3-235B-A22B пишет заключения","kind":"ctx","next":"размещаем модели","open":"roles","key":"b_m4_top_0"},{"text":"GPU и FP8\n8 H100: четыре под 235B, две под реплики 30B, одна под поиск, одна под фоновые задачи","next":"что тормозит повторный ход","open":"memory","key":"b_m4_top_1"},{"text":"Префиксный кэш\nvLLM повторно использует уже обработанные токены, считает новый суффикс","next":"как обеспечить попадания","open":"cache","key":"b_m4_top_2"},{"text":"Совпадение префикса\nСтабильный промпт и схемы, история без пересборки, один эпизод на одной реплике","next":"как безопасно выпускать","open":"serving","key":"b_m4_top_3"},{"text":"Выпуск и откат\nСлияние адаптера → FP8 → проверка комплекта → канарейка → сверка версии → переключение","next":"замер на одном потоке","open":"release","key":"b_m4_top_4"},{"text":"Результат\np95 TTFT повторных ходов: 600 → 80 мс, в 7,5 раза\nПервый ход, качество и весь цикл пакета проверяются отдельно","kind":"num","open":"performance","key":"b_m4_top_5"}],"side":[{"at":2,"text":"Старт: профиль прогона\np95 TTFT повторного хода 600 мс, первого 380 мс"},{"at":2,"kind":"idea","text":"Гипотеза\nПовторные ходы агента заново считают тот же префикс — кэш уберёт эту задержку, если префикс совпадает"},{"at":3,"text":"Онлайн: живой поток\np95 TTFT повторного хода 410 → 55 мс\nЗакэшировано 94% токенов повторных ходов"},{"at":4,"text":"Выпуск\nКомплект ≈2,5 ч (гейт ≈1 ч) + сутки канарейки\nОткат ≈6 мин; regression-набор 75 → 41 мин\n3 выпуска к февралю 2026"},{"at":5,"text":"Офлайн: профиль прогона\nПовторный ход 600 → 80 мс, первый 380 → 150 мс"}]},{"id":"roles","title":"М4 · decoder, encoder и разделение ролей","source":"M4.md, ч. 5–12, 15, 19; legend-m4.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Encoder строит представление входа для поиска или классификации. Decoder авторегрессионно генерирует следующий токен по предыдущему контексту.","kind":"plain","key":"b_m4_roles_0"},{"text":"В М4 маленькая модель делает короткие действия, большая пишет заключение. Требования к качеству и длине выхода у ролей различаются.","kind":"plain","key":"b_m4_roles_1"},{"kind":"idea","text":"Размер выбирают по закрытым задачам и цене ошибки, затем проверяют задержку и стоимость. «Большая всегда лучше» не заменяет сравнения.","key":"b_m4_roles_2"},{"text":"Поток коротких вызовов может упираться в обработку входа и очередь, а не в генерацию длинного ответа. Оптимизировать нужно измеренный этап.","kind":"plain","key":"b_m4_roles_3"},{"kind":"plain","text":"MoE: почему активные параметры не равны памяти всех весов и что делает router.","open":"moe","key":"b_m4_roles_4"},{"kind":"warn","text":"Количество параметров само по себе не задаёт задержку: важны железо, точность, батч, контекст и реализация движка.","key":"b_m4_roles_5"}]},{"id":"moe","title":"М4 · Mixture of Experts","source":"M4.md, ч. 5–12, 15, 19; legend-m4.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"В MoE часть FFN заменена набором экспертов. Router выбирает небольшое число экспертов для токена; attention и другие общие слои остаются.","kind":"plain","key":"b_m4_moe_0"},{"text":"Общие параметры — все веса модели. Активные — используемые для конкретного токена. Меньше активных вычислений не означает хранение только этих весов.","kind":"plain","key":"b_m4_moe_1"},{"kind":"idea","text":"Плюс: больше общей ёмкости при меньшей работе на токен. Цена: маршрутизация, баланс нагрузки и возможные обмены между устройствами.","key":"b_m4_moe_2"},{"kind":"warn","text":"Замороженный router не гарантирует одинаковых маршрутов: скрытые состояния меняются при обучении, а вместе с ними выбор экспертов.","key":"b_m4_moe_3"},{"text":"В М3 шум токенных отношений в MoE — мотив выбора GSPO. В М4 память планируют по всей модели и кешу, а не по обозначению A3B.","kind":"plain","key":"b_m4_moe_4"},{"text":"На собесе: различай MoE и ансамбль. Router выбирает вычисления внутри модели; это не усреднение ответов нескольких независимых LLM.","kind":"plain","key":"b_m4_moe_5"}]},{"id":"memory","title":"М4 · веса, FP8 и память GPU","source":"M4.md, ч. 5–12, 15, 19; legend-m4.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Память serving: веса + KV-кэш + временные буферы и служебный запас. Во время обучения дополнительно нужны градиенты и состояния оптимизатора.","kind":"plain","key":"b_m4_memory_0"},{"kind":"num","text":"Грубая оценка весов: N параметров × байт на вес. FP8 — около байта на вес, bf16 — около двух; масштабы и служебные данные считаются отдельно.","key":"b_m4_memory_1"},{"kind":"ctx","text":"Для 235B только FP8-веса — порядка 235 млрд байт. Это не обещание вместить модель: остаются KV-кэш, буферы, формат хранения и запас.","key":"b_m4_memory_2"},{"text":"Tensor parallel делит вычисления и веса слоя между GPU, но добавляет обмен. Реплики обрабатывают разные запросы независимо и имеют отдельные кэши.","kind":"plain","key":"b_m4_memory_3"},{"kind":"warn","text":"Квантование меняет численную точность и может ухудшить качество. Ускорение зависит от поддержки формата ядрами, а не только размера файла.","key":"b_m4_memory_4"},{"text":"На собесе: обоснуй размещение по замеру памяти при нужном контексте и конкурентности. Мало запросов не уменьшает размер весов.","kind":"plain","key":"b_m4_memory_5"}]},{"id":"cache","title":"М4 · prefix cache и KV-cache","source":"M4.md, ч. 5–12, 15, 19; legend-m4.json. Теория — общее знание. https://docs.vllm.ai/en/latest/features/automatic_prefix_caching/ Учебные примеры не являются замерами кейса.","blocks":[{"text":"KV-cache сохраняет ключи и значения уже обработанных токенов при генерации. Prefix cache переиспользует такие блоки между запросами с общим началом.","kind":"plain","key":"b_m4_cache_0"},{"text":"Кэш ускоряет повторную обработку общего входа. Он не отменяет генерацию новых токенов и не является кэшем готовых текстовых ответов.","kind":"plain","key":"b_m4_cache_1"},{"kind":"idea","text":"Стабильные инструкции и схемы ставят раньше переменных полей; история сохраняется без перерендера. Нужен совпадающий токенный префикс.","key":"b_m4_cache_2"},{"text":"При локальном кэше ходы эпизода направляют на одну реплику. После её отказа другая реплика начинает с холодного префикса.","kind":"plain","key":"b_m4_cache_3"},{"kind":"warn","text":"Кэш занимает конечную память и вытесняется. Смотри попадания вместе с длиной переиспользованного префикса, памятью и реальной задержкой.","key":"b_m4_cache_4"},{"kind":"plain","text":"Что хранится в K и V, зачем attention и почему память растёт с длиной истории — раскрытие ниже.","open":"attention","key":"b_m4_cache_5"}]},{"id":"attention","title":"М4 · attention на пальцах","source":"M4.md, ч. 5–12, 15, 19; legend-m4.json. Теория — общее знание. https://arxiv.org/abs/1706.03762 Учебные примеры не являются замерами кейса.","blocks":[{"text":"Query задаёт, что ищет текущая позиция; key — по какому признаку сопоставить прошлую; value — какую информацию взять из этой позиции.","kind":"plain","key":"b_m4_attention_0"},{"kind":"num","text":"Формула: Attention(Q,K,V)=softmax(QKᵀ/√d_k)V. Матрица сходств после нормировки задаёт веса смешивания значений.","key":"b_m4_attention_1"},{"text":"Буквы: Q,K,V — проекции скрытых состояний; d_k — размер ключа. Causal mask закрывает будущие позиции при авторегрессионном предсказании.","kind":"plain","key":"b_m4_attention_2"},{"kind":"ctx","text":"Учебная подстановка: d_k=4 → делим скоры на 2. Это объясняет масштабирование, а не размер голов Qwen из кейса.","key":"b_m4_attention_3"},{"text":"Для прошлого префикса K и V уже вычислены. Новому токену нужны его проекции и обращение к прошлым K,V; хранить их дешевле, чем пересчитывать каждый ход.","kind":"plain","key":"b_m4_attention_4"},{"kind":"warn","text":"KV-память растёт с длиной контекста, числом слоёв, KV-голов и одновременно обслуживаемых последовательностей. Число KV-голов может отличаться от query-голов.","key":"b_m4_attention_5"}]},{"id":"serving","title":"М4 · очередь, batching и нагрузка","source":"M4.md, ч. 5–12, 15, 19; legend-m4.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Prefill обрабатывает входной контекст; decode пошагово генерирует выход. Их вычислительная нагрузка и влияние на задержку различаются.","kind":"plain","key":"b_m4_serving_0"},{"text":"Batching объединяет вычисления нескольких запросов. Continuous batching допускает новые запросы, пока другие уже генерируют токены.","kind":"plain","key":"b_m4_serving_1"},{"kind":"idea","text":"Больше батч — выше загрузка и пропускная способность, но возможны ожидание и рост хвоста задержки. Нужен компромисс по SLA.","key":"b_m4_serving_2"},{"text":"Маршрутизация по эпизоду повышает локальность кэша. Перекос длинных эпизодов на одну реплику может ухудшить баланс нагрузки.","kind":"plain","key":"b_m4_serving_3"},{"kind":"warn","text":"Рост очереди означает, что входной поток длительно превышает обслуживаемый. Retry увеличивает поток; ограничение конкурентности защищает систему.","key":"b_m4_serving_4"},{"text":"На собесе: укажи длины входа и выхода, конкурентность, разогрев и распределение запросов. Один быстрый запрос не является нагрузочным тестом.","kind":"plain","key":"b_m4_serving_5"}]},{"id":"release","title":"М4 · версии, канарейка и откат","source":"M4.md, ч. 5–12, 15, 19; legend-m4.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Единица выпуска — совместимый комплект: веса, адаптер или результат слияния, токенизатор, chat template, конфигурация движка и инструменты.","kind":"plain","key":"b_m4_release_0"},{"text":"Quality gate сравнивает кандидата с baseline на закрытых задачах и регрессиях. Проверка запуска и проверка качества — разные гейты.","kind":"plain","key":"b_m4_release_1"},{"text":"Канарейка получает ограниченную долю эпизодов. Стабильное назначение удерживает все ходы эпизода на одной версии.","kind":"plain","key":"b_m4_release_2"},{"kind":"warn","text":"Записать новую версию в registry недостаточно: сервер должен подтвердить реально загруженные веса и конфигурацию.","key":"b_m4_release_3"},{"text":"Откат возвращает предыдущий целый комплект; наблюдаемость связывает ответы, ошибки и задержки с версией, чтобы обнаружить регрессию.","kind":"plain","key":"b_m4_release_4"},{"text":"На собесе: назови критерии остановки и отката заранее. Нельзя выбирать удобную защитную метрику уже после ухудшения.","kind":"plain","key":"b_m4_release_5"}]},{"id":"performance","title":"М4 · TTFT, p95 и честный benchmark","source":"M4.md, ч. 5–12, 15, 19; legend-m4.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"TTFT — время от запроса до первого токена. Полная задержка включает также генерацию ответа; throughput измеряет работу за время.","kind":"plain","key":"b_m4_performance_0"},{"text":"p95 — значение, не превышенное примерно в 95% наблюдений. Оно показывает хвост, который среднее может скрыть.","kind":"plain","key":"b_m4_performance_1"},{"kind":"num","text":"В кейсе: p95 повторных ходов 600→80 мс. Отношение 600/80=7,5. Это не ускорение всего пакета в 7,5 раза.","key":"b_m4_performance_2"},{"text":"Для эффекта кэша сравни тот же поток, модели, контексты и конкурентность с кэшем и без. Холодный первый ход оценивается отдельно.","kind":"plain","key":"b_m4_performance_3"},{"kind":"warn","text":"Процентили разных этапов нельзя просто складывать: самый медленный запрос каждого этапа может быть другим. Замерь полный путь отдельно.","key":"b_m4_performance_4"},{"text":"На собесе: сообщи объём выборки, период, условия прогрева, ошибки и качество. Ускорение ценой неверных ответов не считается бесплатным.","kind":"plain","key":"b_m4_performance_5"}]}]},{"id":"m5","group":"legend","title":"М5: модерация спорных объявлений","source":"career/learn/beacon_cases/M5.md, ч. 5–11, 13, 15, 19; trainer/decks/legend-m5.json. Метрики и их условия: ч. 15.","levels":[{"id":"top","title":"М5: модерация спорных объявлений","blocks":[{"text":"Спорная очередь\nАвтоматизируем понятные текстовые проверки; неоднозначное оставляем людям","kind":"ctx","next":"как представить правило","open":"task","key":"b_m5_top_0"},{"text":"Карточка правила\nКороткая инструкция с исключениями, проверенная старшими модераторами","next":"откуда берём обучение","open":"rule","key":"b_m5_top_1"},{"text":"Данные и SFT\n30 тыс. проверок «объявление–правило»; очистка дублей, сплит по продавцам и времени; LoRA на Qwen1.5-14B","next":"проверяем одно правило","open":"data","key":"b_m5_top_2"},{"text":"Один вызов — одно правило\nМодель выдаёт ответ; код собирает результат по всем применимым правилам","next":"когда доверять ответу","open":"inference","key":"b_m5_top_3"},{"text":"Пороги и человек\nКалибровка по правилам; уверенное решение — автоматически, спорное или противоречивое — модератору","next":"проверяем эффект и ошибки","open":"calibration","key":"b_m5_top_4"},{"text":"Результат A/B\nРучных решений в спорной очереди −38%\nОчередь — 9% потока: экономия 3,42% общего потока\nЗащитные метрики: аудит и апелляции","kind":"num","open":"experiment","key":"b_m5_top_5"}],"side":[{"at":0,"text":"Старт\nСпорная очередь — 9% потока, ≈90 тыс. ручных решений в сутки"},{"at":0,"kind":"idea","text":"Гипотеза\nЧасть проверок решается по тексту правила: модель возьмёт их с ошибкой не выше 2%, неоднозначное останется людям"},{"at":1,"text":"Офлайн: карточка\nF1 0,70 против 0,52 у полного раздела (900 проверок исключений, 72B без обучения)"},{"at":2,"text":"Офлайн: SFT\nMacro-F1 0,83 по 28 правилам (test, 6 000 проверок)"},{"at":3,"text":"SLA\n≈10 проверок в секунду на реплику, p95 ≤300 мс"},{"at":4,"text":"Офлайн: пороги\n63% проверок автоматизируемы при ошибке ≤2%; ошибка на них 1,7%\nКалибровка: медиана ECE 0,02"},{"at":5,"text":"Онлайн: A/B 4 недели\nРучных решений −38% (36–40%), ≈34 тыс. в сутки\nЗащитные: аудит 3,1% против 2,9%, апелляции 1,5 против 1,4 на 1 000"}]},{"id":"task","title":"М5 · selective prediction и цена ошибки","source":"M5.md, ч. 5–12, 15, 19; legend-m5.json. Теория — общее знание. Учебные примеры не являются замерами кейса.","blocks":[{"text":"Задача — уменьшить ручную работу при ограничении ошибок. Низкая цена вычисления не оправдывает автоматическое решение в каждом случае.","kind":"plain","key":"b_m5_task_0"},{"text":"Selective prediction: модель отвечает только на уверенной части потока, остальное передаёт человеку. Покрытие и риск рассматривают вместе.","kind":"plain","key":"b_m5_task_1"},{"kind":"idea","text":"Порог выбирают под действие: ложное отклонение честного объявления и лишняя ручная проверка стоят по-разному.","key":"b_m5_task_2"},{"text":"Спорная очередь отличается от полного потока. Качество и долю автоматизации нужно мерить именно на той очереди, где применяется модель.","kind":"plain","key":"b_m5_task_3"},{"kind":"warn","text":"Изменение порогов основной системы меняет состав спорной очереди. Результат на старой очереди может перестать воспроизводиться.","key":"b_m5_task_4"},{"text":"На собесе: назови единицу решения, разрешённые действия, цену FP/FN и защитные метрики, а потом выбирай модель.","kind":"plain","key":"b_m5_task_5"}]},{"id":"rule","title":"М5 · карточка правила против RAG","source":"M5.md, ч. 5–12, 15, 19; legend-m5.json. Т
